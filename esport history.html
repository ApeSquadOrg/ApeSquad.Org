<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Finals Esports Timeline Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset styles specifically for timeline container to override any global styles */
        .timeline-container, .timeline-container * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Timeline-specific styles - isolated from header/footer */
        /* Additional overrides to prevent style.css from affecting timeline */
        .timeline-container {
            all: initial;
            font-family: 'Inter', sans-serif !important;
        }
        
        .timeline-container * {
            all: unset;
            display: revert;
            box-sizing: border-box;
        }
        
        .timeline-container {
            --color-black: #0D0D0E;
            --color-dark-1: #212224;
            --color-dark-2: #2c2d30;
            --color-dark-3: #313338;
            --color-text: #E0E0E0;
            --color-text-muted: #999999;
            --color-text-light: #B0B0B0;
            --accent-green: #08ED83;
            --accent-cyan: #01DBCF;
            --accent-blue: #6E6BF1;
            --accent-purple: #9147FC;
            --accent-orange: #F58815;
            --accent-red: #EA2B00;
            --gradient: linear-gradient(135deg, var(--accent-green), var(--accent-cyan), var(--accent-blue), var(--accent-purple), var(--accent-orange), var(--accent-red));
        }

        .timeline-container {
            background-color: var(--color-black);
            font-family: 'Inter', sans-serif;
            color: var(--color-text);
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .timeline-container * {
            box-sizing: border-box;
        }

        .timeline-container .background-aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            filter: blur(100px) brightness(0.6);
        }

        .timeline-container .background-aurora::before,
        .timeline-container .background-aurora::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
            mix-blend-mode: screen;
        }

        .timeline-container .background-aurora::before {
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, var(--accent-blue), var(--accent-green));
            top: -20%;
            left: -10%;
            animation: move-aurora-1 45s infinite alternate ease-in-out;
        }

        .timeline-container .background-aurora::after {
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, var(--accent-purple), var(--accent-orange));
            bottom: -30%;
            right: -20%;
            animation: move-aurora-2 60s infinite alternate ease-in-out;
        }

        @keyframes move-aurora-1 {
            to { transform: translate(300px, 200px) rotate(30deg) scale(1.2); opacity: 0.3; }
        }

        @keyframes move-aurora-2 {
            to { transform: translate(-250px, -150px) rotate(-45deg) scale(0.9); opacity: 0.25; }
        }

        @keyframes slide-in-left { from { opacity: 0; transform: translateX(-100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slide-in-right { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes dot-activate { 0% { transform: scale(1); box-shadow: 0 0 15px var(--accent-color-transparent); } 50% { transform: scale(1.5); box-shadow: 0 0 30px var(--accent-color), 0 0 45px var(--accent-color-transparent); } 100% { transform: scale(1.2); box-shadow: 0 0 25px var(--accent-color), 0 0 35px var(--accent-color-transparent); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 15px transparent; } 50% { box-shadow: 0 12px 36px rgba(0,0,0,0.4), 0 0 30px var(--accent-color-transparent); } }

        .timeline-container .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .timeline-container .header {
            text-align: center;
            padding: 80px 0 60px;
            position: relative;
        }

        .timeline-container .main-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            animation: titlePulse 4s ease-in-out infinite;
            letter-spacing: -0.02em;
        }

        .timeline-container .subtitle {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--color-text-light);
            margin-bottom: 40px;
        }

        .timeline-container .timeline {
            position: relative;
            padding: 40px 0 80px;
        }

        .timeline-container .timeline::before {
            content: '';
            position: absolute;
            top: 200px; 
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: calc(80% - 400px); 
            background: linear-gradient(to bottom, transparent, var(--color-dark-2), var(--color-dark-2), transparent);
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            animation: float-line 8s ease-in-out infinite;
        }
        
        .timeline-container .timeline::after {
            content: '';
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            background: var(--gradient);
            border-radius: 3px;
            box-shadow: 0 0 15px rgba(8,237,131,0.4);
            height: 0;
            transition: height 0.1s ease-out;
        }

        .timeline-container .season-section {
            position: relative;
            z-index: 1; 
        }
        
        .timeline-container .season-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            opacity: 0.08;
            z-index: -1;
            background-blend-mode: multiply;
            background-color: var(--color-black); 
        }

        .timeline-container #season-beta::before { background-image: url('beta-background.jpg'); }
        .timeline-container #season-1::before { background-image: url('season1-background.jpg'); }
        .timeline-container #season-2::before { background-image: url('season2-background.jpg'); }
        .timeline-container #season-3::before { background-image: url('season3-background.jpg'); }
        .timeline-container #season-4::before { background-image: url('season4-background.jpg'); }
        .timeline-container #season-5::before { background-image: url('season5-background.jpg'); }
        .timeline-container #season-6::before { background-image: url('season6-background.jpg'); }
        .timeline-container #season-7::before { background-image: url('season7-background.jpg'); }
        .timeline-container #season-8::before { background-image: url('season8-background.jpg'); }
        
        .timeline-container .timeline-divider {
            position: relative;
            text-align: center;
            margin: 80px 0 60px;
            width: 100%;
            z-index: 100; 
            opacity: 0;
            animation: fade-in-scale 1.5s ease-out forwards;
        }
        
        @keyframes fade-in-scale { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        
        .timeline-container .timeline-divider span {
            display: inline-block;
            background: var(--gradient);
            border-radius: 50px;
            padding: 3px;
            box-shadow: 0 0 20px var(--accent-color-transparent);
        }

        .timeline-container .timeline-divider span strong {
            display: block;
            background: linear-gradient(135deg, var(--color-dark-2), var(--color-dark-1));
            border-radius: 47px;
            padding: 12px 32px;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: normal;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .timeline-container .divider-theme-green   { --accent-color: var(--accent-green); }
        .timeline-container .divider-theme-cyan    { --accent-color: var(--accent-cyan); }
        .timeline-container .divider-theme-blue    { --accent-color: var(--accent-blue); }
        .timeline-container .divider-theme-purple  { --accent-color: var(--accent-purple); }
        .timeline-container .divider-theme-orange  { --accent-color: var(--accent-orange); }
        .timeline-container .divider-theme-red     { --accent-color: var(--accent-red); }

        .timeline-container .timeline-item { 
            padding: 15px 50px; 
            position: relative; 
            width: 50%; 
            opacity: 0; 
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .timeline-container .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .timeline-container .item-left { left: 0; }
        .timeline-container .item-right { left: 50%; }
        .timeline-container .item-left .timeline-dot { right: -10px; }
        .timeline-container .item-right .timeline-dot { left: -10px; }
        .timeline-container .item-left .timeline-content::after { right: -18px; border-width: 12px 0 12px 18px; border-color: transparent transparent transparent rgba(33, 34, 36, 0.9); }
        .timeline-container .item-right .timeline-content::after { left: -18px; border-width: 12px 18px 12px 0; border-color: transparent rgba(33, 34, 36, 0.9) transparent transparent; }

        .timeline-container .timeline-dot { position: absolute; width: 20px; height: 20px; background: var(--color-dark-1); border: 4px solid var(--accent-color); top: 40px; border-radius: 50%; z-index: 5; box-shadow: 0 0 15px var(--accent-color-transparent); animation: dot-activate 2s ease-in-out infinite alternate; }
        .timeline-container .timeline-content { padding: 25px 25px 45px; background: linear-gradient(135deg, rgba(33, 34, 36, 0.9), rgba(44, 45, 48, 0.9)); backdrop-filter: blur(15px); position: relative; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; animation: pulse-glow 5s ease-in-out infinite; transform: translateY(0); transition: transform 0.3s ease; }
        .timeline-container .timeline-content:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 40px var(--accent-color-transparent); }
        .timeline-container .timeline-content::after { content: ''; position: absolute; top: 35px; width: 0; height: 0; border-style: solid; filter: drop-shadow(0 0 3px rgba(0,0,0,0.3)); }
        .timeline-container .event-tag { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 4px 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border-radius: 6px; letter-spacing: 0.5px; line-height: 1; color: var(--color-black); }
        .timeline-container .tag-premier { background-color: var(--accent-purple); } 
        .timeline-container .tag-community { background-color: var(--accent-green); } 
        .timeline-container .tag-special-event { background-color: var(--accent-orange); } 
        .timeline-container .tag-milestone { background-color: var(--accent-blue); } 
        .timeline-container .tag-grassroots { background-color: var(--accent-cyan); } 
        .timeline-container .tag-embark { background-color: var(--accent-red); } 
        .timeline-container .tag-default { background-color: var(--color-text-muted); }
        .timeline-container .event-title { font-size: 1.4rem; font-weight: 700; color: var(--color-text); margin-bottom: 8px; line-height: 1.3; }
        .timeline-container .event-subtitle { font-weight: 500; color: var(--accent-color); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.95rem; }
        .timeline-container .event-date { font-size: 1rem; font-weight: 500; color: var(--color-text-muted); margin-bottom: 15px; }
        .timeline-container .event-description { font-size: 0.95rem; color: var(--color-text-light); line-height: 1.6; margin-bottom: 15px; }
        .timeline-container .event-links { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .timeline-container .event-link a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-color); text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent-color); text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s ease; }
        .timeline-container .event-link a:hover { background: var(--accent-color); color: var(--color-black); transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-color-transparent); }
        .timeline-container .cancelled { text-decoration: line-through; opacity: 0.6; filter: grayscale(0.5); }
        .timeline-container .theme-community    { --accent-color: var(--accent-green); --accent-color-transparent: #08ED8350; } 
        .timeline-container .theme-premier      { --accent-color: var(--accent-purple); --accent-color-transparent: #9147FC50; } 
        .timeline-container .theme-grassroots   { --accent-color: var(--accent-cyan); --accent-color-transparent: #01DBCF50; } 
        .timeline-container .theme-special-event{ --accent-color: var(--accent-orange); --accent-color-transparent: #F5881550; } 
        .timeline-container .theme-milestone    { --accent-color: var(--accent-blue); --accent-color-transparent: #6E6BF150; } 
        .timeline-container .theme-embark       { --accent-color: var(--accent-red); --accent-color-transparent: #EA2B0050; } 
        .timeline-container .theme-default      { --accent-color: var(--color-text-muted); --accent-color-transparent: #99999950; }
        
        @keyframes titlePulse { 0%, 100% { filter: drop-shadow(0 0 10px rgba(8,237,131,0.3)); } 50% { filter: drop-shadow(0 0 25px rgba(8,237,131,0.6)); } }
        
        @keyframes float-line { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-3px); } }

        /* Scroll indicator */
        .timeline-container .scroll-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--color-text-muted);
            font-size: 0.9rem;
            opacity: 1;
            transition: opacity 0.3s ease;
            z-index: 100;
            text-align: center;
        }

        .timeline-container .scroll-indicator.hidden {
            opacity: 0;
        }

        .timeline-container .scroll-indicator::before {
            content: '↓';
            display: block;
            font-size: 1.5rem;
            animation: bounce 2s infinite;
            color: var(--accent-green);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .timeline-container .main-title {
                font-size: 2.5rem;
            }
            
            .timeline-container .timeline-item {
                width: 100%;
                left: 0 !important;
                padding: 15px 20px;
            }
            
            .timeline-container .timeline::before,
            .timeline-container .timeline::after {
                left: 20px;
                transform: none;
            }
            
            .timeline-container .timeline-dot {
                left: 10px !important;
                right: auto !important;
            }
            
            .timeline-container .timeline-content::after {
                left: -18px !important;
                right: auto !important;
                border-width: 12px 18px 12px 0 !important;
                border-color: transparent rgba(33, 34, 36, 0.9) transparent transparent !important;
            }
        }

    </style>
</head>
<body>

<!-- Header Section -->
<div id="header-placeholder"></div>

<!-- Header/Footer Styles - Load after placeholders -->
<link rel="stylesheet" href="style.css">

<!-- Timeline Content -->
<div class="timeline-container">
    <div class="background-aurora"></div>
    
    <div class="scroll-indicator">
        <div>Scroll to explore</div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 class="main-title">Loading Timeline...</h1>
            <p class="subtitle">Fetching the latest data from the arena!</p>
        </div>
    </div>
</div>

<!-- Footer Section -->
<div id="footer-placeholder"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Load header and footer with better error handling
    const loadFile = async (url) => {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.text();
        } catch (error) {
            console.warn(`Could not load ${url}:`, error);
            return `<!-- ${url} could not be loaded -->`;
        }
    };

    Promise.all([
        loadFile('header.html'),
        loadFile('footer.html')
    ]).then(([headerHtml, footerHtml]) => {
        const headerPlaceholder = document.getElementById('header-placeholder');
        const footerPlaceholder = document.getElementById('footer-placeholder');
        
        if (headerPlaceholder) {
            headerPlaceholder.innerHTML = headerHtml;
        }
        if (footerPlaceholder) {
            footerPlaceholder.innerHTML = footerHtml;
        }
        
        console.log('Header and footer loaded successfully');
    }).catch(error => {
        console.error('Error loading header/footer:', error);
    });

    const SPREADSHEET_ID = '1ANpjO4mcIdjZGZ939-Os2fYq0lDkUvTPn1Ibj4KpBbA';
    const GID = '0'; 

    const API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;
    
    let timelineElement = null;
    let timelineItems = [];

    const fetchAndRenderTimeline = async () => {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) { throw new Error('Network response was not ok'); }
            let text = await response.text();
            
            const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/s)[1];
            const data = JSON.parse(jsonString);

            const events = data.table.rows.map(row => {
                const cells = row.c;
                return { 
                    season: cells[0]?.v || '', 
                    eventName: cells[1]?.v || 'Untitled Event', 
                    type: cells[2]?.v || '', 
                    category: cells[3]?.v || 'Community', 
                    date: cells[4]?.f || cells[4]?.v || 'TBD', 
                    description: cells[5]?.v || '', 
                    link: cells[6]?.v || null 
                };
            }).filter(event => event.season && event.eventName);

            const timelineHTML = generateTimelineHTML(events);
            const timelineContainer = document.querySelector('.timeline-container .container');
            timelineContainer.innerHTML = `
                <div class="header">
                    <h1 class="main-title">History of The Finals Esports</h1>
                    <p class="subtitle">From Beta Tournaments to Global Competition</p>
                </div>
                <div class="timeline">${timelineHTML}</div>
            `;

            // Re-initialize after content is loaded
            initializeScrollEffects();

        } catch (error) {
            console.error('Failed to fetch or render timeline data:', error);
            document.querySelector('.timeline-container .container').innerHTML = `
                <div class="header">
                    <h1 class="main-title">Error Loading Timeline</h1>
                    <p class="subtitle">Could not connect to the data source. Please try again later.</p>
                </div>
            `;
        }
    };

    const initializeScrollEffects = () => {
        timelineElement = document.querySelector('.timeline-container .timeline');
        timelineItems = document.querySelectorAll('.timeline-container .timeline-item');
        
        if (!timelineElement) return;

        // Set up scroll event listener
        window.addEventListener('scroll', updateScrollEffects);
        
        // Initial check
        updateScrollEffects();
        
        // Hide scroll indicator after first scroll
        let hasScrolled = false;
        const scrollIndicator = document.querySelector('.timeline-container .scroll-indicator');
        
        window.addEventListener('scroll', () => {
            if (!hasScrolled && window.scrollY > 50) {
                hasScrolled = true;
                if (scrollIndicator) scrollIndicator.classList.add('hidden');
            }
        });
    };

    const updateScrollEffects = () => {
        if (!timelineElement) return;

        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        
        // Update progress bar
        const timelineRect = timelineElement.getBoundingClientRect();
        const timelineTop = timelineRect.top + scrollTop;
        const timelineHeight = timelineRect.height;
        const timelineBottom = timelineTop + timelineHeight;
        
        // Calculate progress based on timeline visibility
        let progress = 0;
        if (scrollTop + windowHeight > timelineTop) {
            const visibleDistance = Math.min(scrollTop + windowHeight - timelineTop, timelineHeight);
            progress = Math.max(0, Math.min(1, visibleDistance / timelineHeight));
        }
        
        // Update the progress bar
        const progressBar = timelineElement.querySelector('::after');
        if (timelineElement) {
            const maxHeight = timelineHeight; // Account for top/bottom spacing
            const progressHeight = (progress * maxHeight)-450;
            timelineElement.style.setProperty('--progress-height', `${progressHeight}px`);
            
            // Apply the progress to the ::after pseudo-element
            const style = document.createElement('style');
            style.textContent = `
                .timeline-container .timeline::after {
                    height: ${progressHeight}px !important;
                }
            `;
            
            // Remove old style if exists
            const oldStyle = document.querySelector('#timeline-progress-style');
            if (oldStyle) oldStyle.remove();
            
            style.id = 'timeline-progress-style';
            document.head.appendChild(style);
        }
        
        // Animate timeline items on scroll
        timelineItems.forEach((item, index) => {
            const itemRect = item.getBoundingClientRect();
            const itemCenter = itemRect.top + itemRect.height / 2;
            
            // Item is visible when its center is within the viewport
            if (itemCenter < windowHeight && itemCenter > 0) {
                setTimeout(() => {
                    item.classList.add('visible');
                }, index * 50); // Stagger the animations
            }
        });
    };

    const getThemeAndTag = (category) => {
        const catLower = (category || '').toLowerCase().replace(/\s+/g, '-');
        const validThemes = ['community', 'premier', 'grassroots', 'special-event', 'milestone', 'embark'];
        if (validThemes.includes(catLower)) {
            return { theme: `theme-${catLower}`, tag: `tag-${catLower}` };
        }
        return { theme: 'theme-default', tag: 'tag-default' };
    };
    
    const generateLinkHTML = (link) => {
        if (!link || link.trim().toLowerCase() === 'n/a') { return ''; }
        const isVideo = link.includes('youtube.com') || link.includes('twitch.tv');
        const linkText = isVideo ? '📺 Watch VOD' : 'ℹ️ More Info';
        return `<div class="event-links"><div class="event-link"><a href="${link}" target="_blank">${linkText}</a></div></div>`;
    };

    const generateTimelineHTML = (events) => {
        let currentSeason = null;
        let itemCounter = 0;
        const seasonDividerColors = ['green', 'cyan', 'blue', 'purple', 'orange', 'red'];
        let colorIndex = 0;
        
        let html = '';

        events.forEach(event => {
            if (event.season !== currentSeason) {
                if (currentSeason !== null) { html += `</div>`; }
                currentSeason = event.season;
                const dividerColorClass = `divider-theme-${seasonDividerColors[colorIndex % seasonDividerColors.length]}`;
                colorIndex++;
                html += `<div class="season-section" id="season-${currentSeason.toLowerCase().replace(/[^a-z0-9]/g, '-')}"><div class="timeline-divider ${dividerColorClass}"><span><strong>${currentSeason}</strong></span></div>`;
            }

            const positionClass = itemCounter % 2 === 0 ? 'item-left' : 'item-right';
            const { theme, tag } = getThemeAndTag(event.category);
            html += `<div class="timeline-item ${theme} ${positionClass}"><div class="timeline-dot"></div><div class="timeline-content"><span class="event-tag ${tag}">${event.category}</span><h3 class="event-title">${event.eventName}</h3><p class="event-subtitle">${event.type}</p><p class="event-date">${event.date}</p>${event.description ? `<p class="event-description">${event.description}</p>` : ''}${generateLinkHTML(event.link)}</div></div>`;
            itemCounter++;
        });

        if (events.length > 0) { html += `</div>`; }
        return html;
    };

    fetchAndRenderTimeline();
});
</script>

</body>
