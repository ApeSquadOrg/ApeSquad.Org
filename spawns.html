<html lang="en">

    <!-- I kept "Strat Planner" as the title so users know they are on the tool page -->
    <title>Strat Planner | Ape Squad Esports</title>
    
    <meta name="description" content="Join the Ape Squad community. Meet our players, view their highlights, and see our live club leaderboard rankings in The Finals.">
    <meta name="keywords" content="Ape Squad, esports, The Finals, gaming community, pro players, live stream, discord, twitch">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#01a3eb">
    <meta name="msapplication-TileColor" content="#0a0a0a">
    <meta name="theme-color" content="#0a0a0a">
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Ayuthaya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --midnight-black: #0a0a0a;
            --near-black: #111;
            --electric-blue: #01a3eb;
            --neon-pink: #ff4494;
            --font-headline: 'Anton', sans-serif;
            --font-body: 'Ayuthaya', monospace;
        }

        body { 
            margin: 0; padding: 0; background: black; color: white; 
            font-family: var(--font-body); overflow: hidden; 
        }

        main { display: flex; height: 100vh; width: 100vw; }

        /* --- SIDEBAR --- */
        #planner-sidebar {
            width: 300px; background: var(--near-black);
            border-right: 1px solid #333; z-index: 100;
            display: flex; flex-direction: column; flex-shrink: 0;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
        }
        .sidebar-header { padding: 20px; background: var(--midnight-black); border-bottom: 1px solid #333; }
        .sidebar-header h2 { margin: 0; color: var(--electric-blue); font-family: var(--font-headline); letter-spacing: 1px; }
        .sidebar-content { padding: 20px; flex: 1; overflow-y: auto; }
        
        .control-group { margin-bottom: 25px; }
        .control-label { display: block; color: var(--neon-pink); font-family: var(--font-headline); margin-bottom: 8px; }
        
        .planner-select {
            width: 100%; padding: 10px; background: #222; color: white;
            border: 1px solid #444; border-radius: 4px; cursor: pointer;
        }

        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tool-btn {
            background: #222; border: 1px solid #444; color: #888;
            padding: 15px; border-radius: 6px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            transition: 0.2s; user-select: none;
        }
        .tool-btn:hover { background: #333; color: white; }
        .tool-btn.active {
            background: rgba(1, 163, 235, 0.15); border-color: var(--electric-blue);
            color: var(--electric-blue);
        }

        .action-btn {
            width: 100%; padding: 10px; margin-top: 10px; background: #333; border: none;
            color: white; cursor: pointer; font-weight: bold; border-radius: 4px;
        }
        .action-btn:hover { background: #444; }
        .action-btn.danger { background: rgba(255, 68, 148, 0.2); color: var(--neon-pink); border: 1px solid var(--neon-pink); }

        /* --- MAP VIEWPORT --- */
        #planner-viewport {
            flex: 1; position: relative; background: #050505;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden; cursor: default; touch-action: none;
        }

        #mapWrapper {
            position: absolute; top: 0; left: 0;
            transform-origin: 0 0;
            display: inline-block;
            width: auto; height: auto;
        }

        #mapImage { pointer-events: none; display: block; user-select: none; }
        
        #drawing-canvas {
            position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10;
        }
        #drawing-canvas.active { pointer-events: auto; }

        #token-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 20; pointer-events: none;
        }

        /* --- TOKEN STYLES --- */
        
        /* 1. The Wrapper is now just the small "Handle" in the center */
        .token-wrapper {
            position: absolute; 
            width: 40px; height: 40px; /* Small Hitbox Size */
            transform: translate(-50%, -50%);
            
            /* Visual indicator for the handle (optional, helps you see where to grab) */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            
            cursor: grab; z-index: 100;
            pointer-events: auto; touch-action: none; user-select: none;
        }

        .token-wrapper:hover {
            background: rgba(1, 163, 235, 0.4); /* Highlight handle on hover */
            border-color: var(--electric-blue);
        }

        /* 2. The Image hangs off the handle but is native size */
        .token-wrapper img {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); /* Centers image on the handle */
            
            /* Native Resolution */
            width: auto; height: auto; 
            
            /* IMPORTANT: Image ignores clicks, so you don't grab by the giant image */
            pointer-events: none;
            
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
            -webkit-user-drag: none; user-drag: none;
        }
        
        .token-wrapper.dragging { cursor: grabbing; z-index: 999; }
        
        /* Ghost Preview */
        #ghost-token {
            position: fixed; pointer-events: none; opacity: 0.6; z-index: 9999;
            transform: translate(-50%, -50%); display: none;
            width: auto; height: auto;
        }

        .map-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--electric-blue); font-family: var(--font-headline); font-size: 2rem;
            display: none; pointer-events: none;
        }

        #context-menu {
            position: fixed; background: #111; border: 1px solid var(--electric-blue);
            z-index: 10000; display: none; padding: 5px;
        }
        #context-menu button {
            background: none; border: none; color: white; padding: 8px 15px;
            width: 100%; text-align: left; cursor: pointer;
        }
        #context-menu button:hover { background: var(--electric-blue); }
    </style>
</head>
<body>

    <main>
        <div id="planner-sidebar">
            <div class="sidebar-header">
                <h2>TACTICAL BOARD</h2>
            </div>
            
            <div class="sidebar-content">
                <div class="control-group">
                    <label class="control-label">MAP</label>
                    <select id="mapSelect" class="planner-select">
                        <option value="Bernal">Bernal</option>
                        <option value="Citadel">Citadel</option>
                        <option value="Fortune">Fortune</option>
                        <option value="Monaco">Monaco</option>
                        <option value="Seoul">Seoul</option>
                        <option value="Skyway">Skyway</option>
                        <option value="SysHorizon">SysHorizon</option>
                        <option value="Vegas">Vegas</option>
			<option value="Fangwai">Fangwai</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">TOOLS</label>
                    <div class="tool-grid">
                        <div class="tool-btn active" data-tool="cursor">
                            <i class="fa-solid fa-arrow-pointer"></i> Cursor
                        </div>
                        <div class="tool-btn" data-tool="draw">
                            <i class="fa-solid fa-paintbrush"></i> Draw
                        </div>
                        <div class="tool-btn" data-tool="player">
                            <i class="fa-solid fa-user"></i> Player
                        </div>
                        <div class="tool-btn" data-tool="cashbox">
                            <i class="fa-solid fa-box"></i> Box
                        </div>
                    </div>
                </div>

                <div class="control-group" id="brush-controls" style="display:none;">
                    <label class="control-label">BRUSH</label>
                    <div style="display:flex; gap:10px;">
                        <input type="color" id="brush-color" value="#01a3eb" style="border:none; background:none; cursor:pointer;">
                        <input type="range" id="brush-size" min="2" max="30" value="5" style="flex:1;">
                    </div>
                </div>

                <div class="control-group">
                    <button id="reset-view" class="action-btn">Reset View</button>
                    <button id="clear-all" class="action-btn danger">Clear All</button>
                </div>
            </div>
        </div>

        <div id="planner-viewport">
            <div class="map-loader" id="loader">LOADING...</div>
            <div id="mapWrapper">
                <img id="mapImage" src="" alt="">
                <canvas id="drawing-canvas"></canvas>
                <div id="token-layer"></div>
            </div>
        </div>
    </main>

    <img id="ghost-token" src="">
    
    <div id="context-menu">
        <button id="ctx-delete">Delete</button>
    </div>

    <script>
        class TacticalMap {
            constructor() {
                // Elements
                this.viewport = document.getElementById('planner-viewport');
                this.wrapper = document.getElementById('mapWrapper');
                this.mapImage = document.getElementById('mapImage');
                this.canvas = document.getElementById('drawing-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.tokenLayer = document.getElementById('token-layer');
                this.ghost = document.getElementById('ghost-token');
                
                // State
                this.scale = 1;
                this.panX = 0;
                this.panY = 0;
                this.isPanning = false;
                this.lastMouseX = 0;
                this.lastMouseY = 0;
                this.currentTool = 'cursor';
                
                // Assets
                this.assets = {
                    player: 'images/mapsmanip/Player.png',
                    cashbox: 'images/mapsmanip/Cashbox.png'
                };

                // Brush
                this.isDrawing = false;
                this.brushColor = '#01a3eb';
                this.brushSize = 5;

                this.init();
            }

            init() {
                this.loadMap('Bernal');
                this.setupControls();
                this.setupMapInteractions();
            }

            loadMap(name) {
                document.getElementById('loader').style.display = 'block';
                this.mapImage.style.opacity = '0';
                
                const img = new Image();
                img.onload = () => {
                    this.mapImage.src = img.src;
                    this.mapImage.style.opacity = '1';
                    document.getElementById('loader').style.display = 'none';
                    
                    this.canvas.width = img.naturalWidth;
                    this.canvas.height = img.naturalHeight;
                    
                    this.fitToScreen();
                };
                img.onerror = () => { document.getElementById('loader').innerText = "IMG NOT FOUND"; };
                img.src = `images/mapsmanip/${name}.png`;
            }

            fitToScreen() {
                const margin = 50;
                const w = this.viewport.clientWidth - margin;
                const h = this.viewport.clientHeight - margin;
                const mapW = this.canvas.width || 1000;
                const mapH = this.canvas.height || 1000;
                
                this.scale = Math.min(w / mapW, h / mapH);
                this.panX = (this.viewport.clientWidth - (mapW * this.scale)) / 2;
                this.panY = (this.viewport.clientHeight - (mapH * this.scale)) / 2;
                this.updateTransform();
            }

            updateTransform() {
                this.wrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.scale})`;
            }

            setupControls() {
                document.getElementById('mapSelect').onchange = (e) => {
                    this.tokenLayer.innerHTML = ''; 
                    this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height); 
                    this.loadMap(e.target.value);
                };

                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.onclick = () => {
                        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentTool = btn.dataset.tool;
                        
                        this.canvas.classList.remove('active');
                        this.ghost.style.display = 'none';
                        document.getElementById('brush-controls').style.display = 'none';

                        if(this.currentTool === 'draw') {
                            this.canvas.classList.add('active');
                            document.getElementById('brush-controls').style.display = 'block';
                        }
                        else if(['player', 'cashbox'].includes(this.currentTool)) {
                            this.ghost.src = this.assets[this.currentTool];
                            this.ghost.style.display = 'block';
                        }
                    }
                });

                document.getElementById('clear-all').onclick = () => {
                    this.tokenLayer.innerHTML = '';
                    this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                };
                
                document.getElementById('reset-view').onclick = () => this.fitToScreen();

                document.getElementById('brush-color').oninput = (e) => this.brushColor = e.target.value;
                document.getElementById('brush-size').oninput = (e) => this.brushSize = e.target.value;
                
                document.addEventListener('click', (e) => {
                     document.getElementById('context-menu').style.display = 'none';
                });
                document.getElementById('ctx-delete').onclick = () => {
                    if(this.ctxTarget) this.ctxTarget.remove();
                };
            }

            setupMapInteractions() {
                this.viewport.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const oldScale = this.scale;
                    const delta = -Math.sign(e.deltaY) * 0.1;
                    this.scale = Math.max(0.05, Math.min(4, this.scale + delta));
                    
                    const rect = this.viewport.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    const scaleChange = this.scale - oldScale;
                    this.panX -= (mouseX - this.panX) / oldScale * scaleChange;
                    this.panY -= (mouseY - this.panY) / oldScale * scaleChange;
                    
                    this.updateTransform();
                    this.updateGhost(e); 
                });

                this.viewport.addEventListener('mousedown', (e) => {
                    if(e.button === 1 || (e.button === 0 && this.currentTool === 'cursor')) {
                        if(e.target === this.viewport || e.target === this.mapImage || e.target.id === 'token-layer') {
                            this.isPanning = true;
                            this.lastMouseX = e.clientX;
                            this.lastMouseY = e.clientY;
                            this.viewport.style.cursor = 'grabbing';
                        }
                    }
                    else if(e.button === 0 && ['player', 'cashbox'].includes(this.currentTool)) {
                        this.addToken(e);
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if(this.isPanning) {
                        this.panX += e.clientX - this.lastMouseX;
                        this.panY += e.clientY - this.lastMouseY;
                        this.lastMouseX = e.clientX;
                        this.lastMouseY = e.clientY;
                        this.updateTransform();
                    }
                    this.updateGhost(e);
                });

                window.addEventListener('mouseup', () => {
                    this.isPanning = false;
                    if(this.currentTool === 'cursor') this.viewport.style.cursor = 'default';
                });

                // DRAWING
                const getCanvasPos = (e) => {
                    const rect = this.wrapper.getBoundingClientRect();
                    return {
                        x: (e.clientX - rect.left) / this.scale,
                        y: (e.clientY - rect.top) / this.scale
                    };
                };

                this.canvas.addEventListener('mousedown', (e) => {
                    if(this.currentTool !== 'draw') return;
                    this.isDrawing = true;
                    this.ctx.beginPath();
                    const pos = getCanvasPos(e);
                    this.ctx.moveTo(pos.x, pos.y);
                });

                window.addEventListener('mousemove', (e) => {
                    if(!this.isDrawing) return;
                    const pos = getCanvasPos(e);
                    this.ctx.lineTo(pos.x, pos.y);
                    this.ctx.strokeStyle = this.brushColor;
                    this.ctx.lineWidth = this.brushSize;
                    this.ctx.lineCap = 'round';
                    this.ctx.stroke();
                });

                window.addEventListener('mouseup', () => this.isDrawing = false);
            }

            updateGhost(e) {
                if(this.ghost.style.display === 'block') {
                    this.ghost.style.left = e.clientX + 'px';
                    this.ghost.style.top = e.clientY + 'px';
                    this.ghost.style.transform = `translate(-50%, -50%) scale(${this.scale})`;
                }
            }

            addToken(e) {
                const rect = this.wrapper.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.scale;
                const y = (e.clientY - rect.top) / this.scale;

                const el = document.createElement('div');
                el.className = 'token-wrapper ' + this.currentTool;
                // Position centered on mouse
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                
                const img = document.createElement('img');
                img.src = this.assets[this.currentTool];
                
                el.appendChild(img);
                this.setupTokenDrag(el);
                
                el.oncontextmenu = (ev) => {
                    ev.preventDefault();
                    ev.stopPropagation(); 
                    this.ctxTarget = el;
                    const menu = document.getElementById('context-menu');
                    menu.style.display = 'block';
                    menu.style.left = ev.clientX + 'px';
                    menu.style.top = ev.clientY + 'px';
                }

                this.tokenLayer.appendChild(el);
            }

            setupTokenDrag(el) {
                el.onpointerdown = (e) => {
                    if(e.button !== 0 || this.currentTool !== 'cursor') return;
                    e.preventDefault(); 
                    e.stopPropagation(); 
                    el.setPointerCapture(e.pointerId);
                    el.classList.add('dragging');
                    el.isDragging = true;
                };

                el.onpointermove = (e) => {
                    if(!el.isDragging) return;
                    const rect = this.wrapper.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / this.scale;
                    const y = (e.clientY - rect.top) / this.scale;
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                };

                el.onpointerup = (e) => {
                    el.isDragging = false;
                    el.classList.remove('dragging');
                    el.releasePointerCapture(e.pointerId);
                };
            }
        }

        window.onload = () => new TacticalMap();
    </script>
</body>
</html>
