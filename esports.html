    <!-- LIGHTBOX SCRIPT -->
    <script>
        // Get the modal
        var modal = document.getElementById("imageModal");
        var modalImg = document.getElementById("modalImg");
        var captionText = document.getElementById("caption");
        var body = document.body;

        // Get all images with class "clickable-photo"
        var images = document.querySelectorAll('.clickable-photo');

        // Loop through images and add click event
        images.forEach(function(img) {
            img.onclick = function(){
                modal.style.display = "block";
                modalImg.src = this.src;
                captionText.innerHTML = this.alt;
                // Prevent scrolling background
                body.style.overflow = "hidden";
                // Add fade in effect
                setTimeout(() => { modal.style.opacity = "1"; }, 10);
            }
        });

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close-modal")[0];

        // When the user clicks on <span> (x), close the modal
        function closeModal() {
            modal.style.opacity = "0";
            setTimeout(() => { 
                modal.style.display = "none"; 
                body.style.overflow = "auto"; // Re-enable scroll
            }, 300);
        }

        span.onclick = function() { closeModal(); }

        // Also close if clicking outside the image
        modal.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }
        
        // Close on Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
