<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Club - Ape Squad Esports</title>
    
    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="/style.css">

    <!-- Google Fonts & Font Awesome from your theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- PAGE-SPECIFIC STYLES -->
    <style>
        /* This CSS uses the variables from your main style.css file */
        #club-page {
            padding: 120px 0;
            background: 
                linear-gradient(rgba(10, 10, 10, 0.7), var(--darker-bg)),
                radial-gradient(circle at 10% 20%, rgba(3, 183, 250, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(156, 70, 200, 0.05) 0%, transparent 40%);
            transition: padding 0.3s ease-in-out; /* Smooth transition for padding changes */
        }

        .club-intro {
            text-align: center;
            max-width: 600px;
            margin: -30px auto 60px auto;
            font-family: var(--font-tech);
            font-size: 1.2rem;
            color: var(--standout-blue);
            opacity: 0.8;
        }

        #club-lists-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .clubContainer {
            background: linear-gradient(145deg, rgba(15, 42, 10, 0.5), rgba(26, 67, 20, 0.4));
            border: 2px solid var(--primary-purple);
            border-radius: 15px;
            padding: 30px 40px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: padding 0.3s ease-in-out; /* Smooth transition */
        }

        .clubContainer h2 {
            font-family: var(--font-headings);
            font-size: 2.5rem;
            color: var(--accent-orange);
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--accent-orange);
        }

        .clubList {
            list-style-type: none;
            padding: 0;
            margin: 0;
            column-count: 4;
            column-gap: 30px;
        }

        .clubList li {
            font-family: var(--font-tech);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--light-text);
            margin-bottom: 15px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            break-inside: avoid;
        }

        .clubList li:hover {
            background: rgba(3, 183, 250, 0.1);
            color: var(--standout-blue);
            transform: translateX(5px);
        }
        
        .clubList li a {
            color: inherit; 
            text-decoration: none;
            display: block; 
            margin: -5px -10px; 
            padding: 5px 10px;
        }

        /* --- Loader and Error States --- */
        .loader-container { text-align: center; padding: 50px 0; }
        .loader-container p { font-family: var(--font-tech); margin-top: 20px; font-size: 1.1rem; color: var(--light-text); opacity: 0.7; }
        .error-message { font-family: var(--font-tech); color: #ff5555; text-align: center; font-size: 1.2rem; padding: 20px; }

        /* --- MOBILE OPTIMIZATIONS --- */
        /* Tablet Portrait */
        @media (max-width: 992px) {
            .clubList {
                column-count: 3;
            }
        }

        /* Large Phones / Tablet Portrait */
        @media (max-width: 768px) {
            #club-page {
                padding: 80px 0; /* Reduce overall page padding */
            }
            .clubContainer {
                padding: 25px 20px; /* Reduce container padding */
            }
            .clubList {
                column-count: 2; /* Switch to 2 columns */
            }
            .clubContainer h2 {
                font-size: 2.2rem; /* Slightly smaller heading */
            }
        }

        /* Standard Mobile Phones */
        @media (max-width: 480px) {
            #club-page {
                padding: 60px 0; /* Further reduce padding */
            }
            .club-intro {
                font-size: 1rem; /* Make intro text smaller */
            }
            .clubContainer {
                padding: 20px 15px; /* Tighter padding */
            }
            .clubList {
                column-count: 1; /* Single column for best readability */
                column-gap: 0;
            }
            .clubContainer h2 {
                font-size: 1.8rem; /* Make heading more mobile-friendly */
            }
            .clubList li {
                font-size: 1rem; /* Smaller font for player names */
                text-align: center; /* Center names in single column view */
            }
            .clubList li:hover {
                transform: translateX(0); /* Disable hover-move effect on mobile */
            }
        }
    </style>

</head>
<body>

    <header></header>

    <main>
        <section id="club-page">
            <div class="container">
                <h2 class="glitch" data-text="THE CLUB">THE CLUB</h2>
                <p class="club-intro">Live leaderboard data for all official Ape Squad clubs.</p>

                <div id="appContainer">
                    <div class="loader-container">
                        <div class="loading-spinner"></div>
                        <p>Fetching Leaderboard Data...</p>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer></footer>

    <script src="/js/main.js"></script>
    
    <script>
        const platform = 'crossplay';
        const apiUrl = `https://api.the-finals-leaderboard.com/v1/leaderboard/s7/${platform}`;
        const targetClubTags = ['APEZ'];

        async function fetchAndDisplayMembers(clubTag, appContainer) {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                const data = await response.json();

                const clubContainer = document.createElement('div');
                clubContainer.classList.add('clubContainer');

                const heading = document.createElement('h2');
                heading.textContent = `${clubTag} Members`;
                clubContainer.appendChild(heading);

                const memberList = document.createElement('ul');
                memberList.classList.add('clubList');
                clubContainer.appendChild(memberList);

                if (data && data.data && Array.isArray(data.data)) {
                    const clubMembers = data.data.filter(user => user.clubTag === clubTag);

                    if (clubMembers.length > 0) {
                        clubMembers.forEach(member => {
                            const fullName = member.name;
                            const displayName = fullName.split('#')[0];
                            const encodedName = encodeURIComponent(fullName);
                            const playerPageUrl = `https://www.davg25.com/app/the-finals-leaderboard-tracker/player-stats/?id=${encodedName}&season=s7`;

                            const listItem = document.createElement('li');
                            const link = document.createElement('a');

                            link.href = playerPageUrl;
                            link.textContent = displayName;
                            link.target = "_blank"; 
                            link.rel = "noopener noreferrer"; 

                            listItem.appendChild(link);
                            memberList.appendChild(listItem);
                        });
                    } else {
                        const noMembersMessage = document.createElement('li');
                        noMembersMessage.textContent = `No members found in club ${clubTag} on the leaderboard.`;
                        memberList.appendChild(noMembersMessage);
                    }
                } else {
                    const noDataMessage = document.createElement('li');
                    noDataMessage.textContent = 'No leaderboard data found.';
                    memberList.appendChild(noDataMessage);
                }

                appContainer.appendChild(clubContainer);
            } catch (error) {
                console.error(`Error fetching leaderboard data for ${clubTag}:`, error);
                const errorElement = document.createElement('p');
                errorElement.classList.add('error-message');
                errorElement.textContent = `Error loading ${clubTag} member list. The API might be temporarily unavailable.`;
                appContainer.appendChild(errorElement);
            }
        }

        async function displayAllClubs() {
            const appContainer = document.getElementById('appContainer');
            appContainer.innerHTML = ''; 

            for (const clubTag of targetClubTags) {
                await fetchAndDisplayMembers(clubTag, appContainer);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            displayAllClubs();
        });
    </script>
</body>
</html>
