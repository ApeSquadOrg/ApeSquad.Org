    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page-Specific Title & Description -->
    <title>Strategic Maps | Ape Squad Esports</title>
    <meta name="description" content="Explore detailed top-down maps of The Finals with interactive points of interest. Plan your strategy with Ape Squad.">
    <meta name="keywords" content="Ape Squad, esports, The Finals, gaming, pro team, competitive gaming, maps, strategy, monaco, seoul, las vegas">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#01a3eb">
    <meta name="msapplication-TileColor" content="#0a0a0a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Ayuthaya&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Page-Specific CSS -->
    <style>
        /*
        ========================================
        --- MAPS PAGE STYLES ---
        ========================================
        */

        /* Let the main stylesheet handle body background and fonts */
        #maps-page {
            background-color: var(--near-black);
        }

        /* Re-styling the header to match the main theme's h2 */
        #maps-page h2 {
            font-family: var(--font-headline);
            font-size: 2.8rem;
            text-shadow: 0 0 8px rgba(1, 163, 235, 0.5);
            font-weight: 400;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 1rem;
            /* Removing the old gradient text style */
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            -webkit-text-fill-color: unset;
            animation: none;
            color: var(--off-white);
        }

        /* Make intro text match the global <p> styles */
        .section-intro {
            text-align: center;
            font-size: 1.1rem;
            max-width: 70ch;
            margin: -1rem auto 3rem auto;
            color: #BBBBBB;
            font-family: var(--font-body);
        }

        /* --- LAYOUT STYLES --- */
        .map-layout-wrapper {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        /* --- MAP CONTROLS SIDEBAR (THEMED) --- */
        .map-controls-container {
            flex: 0 0 300px;
            background: var(--midnight-black);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            /* Removing old styles */
            backdrop-filter: none;
            box-shadow: none;
        }
        
        .map-selector-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .map-selector-wrapper label {
            font-family: var(--font-headline);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        #map-selector-dropdown {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: var(--font-body);
            font-size: 1rem;
            background-color: var(--near-black);
            color: var(--off-white);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #map-selector-dropdown:hover {
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px rgba(1, 163, 235, 0.3);
        }
        
        .map-toggles {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toggle-switch { display: flex; align-items: center; gap: 0.75rem; }
        .toggle-switch label {
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: #BBBBBB;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }
        .toggle-switch:hover label { color: var(--electric-blue); }
        .toggle-switch input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--electric-blue);
        }
        
        .credit-area {
            margin-top: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .credit-area p {
            font-size: 0.9rem;
            color: var(--light-grey);
            line-height: 1.5;
            max-width: none;
            margin-bottom: 0;
        }

        #map-display-area {
            flex: 1;
            transition: opacity 0.3s ease-in-out;
            min-height: 700px;
        }
        #map-display-area.is-fading { opacity: 0; }

        #map-display-area h3 {
            font-family: var(--font-headline);
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--off-white);
            border-left: 4px solid var(--electric-blue);
            padding-left: 1rem;
            text-shadow: 0 0 8px rgba(1, 163, 235, 0.5);
        }

        .map-image-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
             /* Remove old pulse animation */
            background: none;
            padding: 0;
            animation: none;
        }
        .map-image-wrapper:hover {
            transform: translateY(-5px);
            border-color: var(--electric-blue);
            box-shadow: 0 0 25px rgba(1, 163, 235, 0.3);
        }
        
        .map-image-wrapper .base-map { width: 100%; display: block; }
        .map-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        #map-display-area.pois-hidden .poi-overlay, 
        #map-display-area.objectives-hidden .objective-overlay, 
        #map-display-area.spawns-hidden .spawn-overlay { 
            opacity: 0; 
        }

        @media (max-width: 992px) {
            .map-layout-wrapper { flex-direction: column; }
            .map-controls-container {
                flex: 1;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 1.5rem 2.5rem;
            }
            .map-selector-wrapper { flex-basis: 100%; }
            .map-toggles { flex: 1; }
            .credit-area { flex: 1; }
        }
    </style>
</head>
<body>

    <header class="navbar"></header> <!-- Populated by main.js -->

    <main>
        <section id="maps-page">
            <div class="container">
                <h2>Strategic Maps</h2>
                <p class="section-intro">Select a map from the dropdown, then use the toggles to show or hide points of interest, objectives, and spawn points for tactical planning.</p>
                
                <div class="map-layout-wrapper">
                    
                    <div class="map-controls-container">
                        <div class="map-selector-wrapper">
                            <label for="map-selector-dropdown">Select Map</label>
                            <select id="map-selector-dropdown"></select>
                        </div>
                        <div class="map-toggles">
                            <div class="toggle-switch">
                                <input type="checkbox" id="toggle-pois">
                                <label for="toggle-pois">Points of Interest</label>
                            </div>
                            <div class="toggle-switch">
                                <input type="checkbox" id="toggle-objectives">
                                <label for="toggle-objectives">Objectives</label>
                            </div>
                            <div class="toggle-switch">
                                <input type="checkbox" id="toggle-spawns">
                                <label for="toggle-spawns">Spawn Points</label>
                            </div>
                        </div>

                        <div class="credit-area">
                            <p>
                                Maps Made by: APE SQUAD<br>
                                Cashout Locations by: Akimbof
                            </p>
                        </div>

                    </div>

                    <div id="map-display-area">
                        <!-- Map content will be injected here by JavaScript -->
                    </div>

                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer"></footer> <!-- Populated by main.js -->

    <!-- Scripts (Keep these at the bottom) -->
    
    <!-- Page-Specific Map Functionality Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {

            const mapsData = [
                { name: "Monaco", imageSrc: "/images/maps/Monaco.png", poiOverlay: "/images/maps/overlays/Monaco_POIs.png", objectiveOverlay: "/images/maps/overlays/Monaco_Objectives.png", spawnOverlay: "/images/maps/overlays/Monaco_Spawns.png" },
                { name: "Seoul", imageSrc: "/images/maps/Seoul.png", poiOverlay: "/images/maps/overlays/Seoul_POIs.png", objectiveOverlay: "/images/maps/overlays/Seoul_Objectives.png", spawnOverlay: "/images/maps/overlays/Seoul_Spawns.png" },
                { name: "Las Vegas", imageSrc: "/images/maps/Vegas.png", poiOverlay: "/images/maps/overlays/Vegas_POIs.png", objectiveOverlay: "/images/maps/overlays/Vegas_Objectives.png", spawnOverlay: "/images/maps/overlays/Vegas_Spawns.png" },
                { name: "Skyway Stadium", imageSrc: "/images/maps/Skyway.png", poiOverlay: "/images/maps/overlays/SkywayStadium_POIs.png", objectiveOverlay: "/images/maps/overlays/SkywayStadium_Objectives.png", spawnOverlay: "/images/maps/overlays/SkywayStadium_Spawns.png" },
                { name: "SYS$HORIZON", imageSrc: "/images/maps/SysHorizon.png", poiOverlay: "/images/maps/overlays/SysHorizon_POIs.png", objectiveOverlay: "/images/maps/overlays/SysHorizon_Objectives.png", spawnOverlay: "/images/maps/overlays/SysHorizon_Spawns.png" },
                { name: "Fortune Stadium", imageSrc: "/images/maps/Fortune.png", poiOverlay: "/images/maps/overlays/Fortune_POIs.png", objectiveOverlay: "/images/maps/overlays/Fortune_Objectives.png", spawnOverlay: "/images/maps/overlays/Fortune_Spawns.png" },
                { name: "Nozomi/Citadel", imageSrc: "/images/maps/Citadel.png", poiOverlay: "/images/maps/overlays/Citadel_POIs.png", objectiveOverlay: "/images/maps/overlays/Citadel_Objectives.png", spawnOverlay: "/images/maps/overlays/Citadel_Spawns.png" },
                { name: "Bernal", imageSrc: "/images/maps/Bernal.png", poiOverlay: "/images/maps/overlays/Bernal_POIs.png", objectiveOverlay: "/images/maps/overlays/Bernal_Objectives.png", spawnOverlay: "/images/maps/overlays/Bernal_Spawns.png" },
                { name: "Kyoto", imageSrc: "/images/maps/Kyoto1.png", poiOverlay: "/images/maps/overlays/Kyoto_POIs.png", objectiveOverlay: "/images/maps/overlays/Kyoto_Objectives.png", spawnOverlay: "/images/maps/overlays/Kyoto_Spawns.png" }
            ];

            const selectorDropdown = document.getElementById("map-selector-dropdown");
            const displayArea = document.getElementById("map-display-area");
            const togglePois = document.getElementById("toggle-pois");
            const toggleObjectives = document.getElementById("toggle-objectives");
            const toggleSpawns = document.getElementById("toggle-spawns");

            function renderMap(mapName) {
                const map = mapsData.find(m => m.name === mapName);
                if (!map) { 
                    displayArea.innerHTML = `<p>Error: Map not found.</p>`; 
                    return; 
                }

                displayArea.innerHTML = `
                    <h3>${map.name}</h3>
                    <div class="map-image-wrapper">
                        <img src="${map.imageSrc}" alt="Top-down map of ${map.name}" class="base-map" loading="lazy">
                        <img src="${map.poiOverlay}" class="map-overlay poi-overlay" alt="POI Overlay">
                        <img src="${map.objectiveOverlay}" class="map-overlay objective-overlay" alt="Objective Overlay">
                        <img src="${map.spawnOverlay}" class="map-overlay spawn-overlay" alt="Spawn Overlay">
                    </div>`;
                
                updateToggleVisibility();
            }
            
            function transitionToMap(mapName) {
                displayArea.classList.add('is-fading');
                displayArea.addEventListener('transitionend', function handler() {
                    displayArea.removeEventListener('transitionend', handler);
                    renderMap(mapName);
                    window.location.hash = encodeURIComponent(mapName);
                    displayArea.classList.remove('is-fading');
                }, { once: true });
            }

            function populateSelector() {
                mapsData.forEach(map => {
                    const option = document.createElement("option");
                    option.value = map.name;
                    option.textContent = map.name;
                    selectorDropdown.appendChild(option);
                });
            }

            function updateToggleVisibility() {
                displayArea.classList.toggle('pois-hidden', !togglePois.checked);
                displayArea.classList.toggle('objectives-hidden', !toggleObjectives.checked);
                displayArea.classList.toggle('spawns-hidden', !toggleSpawns.checked);
            }

            function setupEventListeners() {
                selectorDropdown.addEventListener('change', (event) => {
                    transitionToMap(event.target.value);
                });

                const handleToggle = () => updateToggleVisibility();
                togglePois.addEventListener('change', handleToggle);
                toggleObjectives.addEventListener('change', handleToggle);
                toggleSpawns.addEventListener('change', handleToggle);
            }

            function initializeApp() {
                populateSelector();
                
                const currentHash = window.location.hash.substring(1);
                const decodedHash = decodeURIComponent(currentHash);
                
                const startingMap = mapsData.find(m => m.name === decodedHash);
                const startingMapName = startingMap ? startingMap.name : (mapsData.length > 0 ? mapsData[0].name : null);
                
                if (startingMapName) {
                    selectorDropdown.value = startingMapName;
                    renderMap(startingMapName);
                }
                
                setupEventListeners();
            }

            initializeApp();
        });
    </script>
    
    <!-- Script to Load Header and Footer -->
    <script src="js/main.js"></script>
</body>
</html>
