<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Teams - Ape Squad Esports</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tracking Scripts would go here -->

    <style>
        /* Base styles (assuming these might be in your style.css) */
        :root {
            --primary-purple: #9c46c8;
            --accent-orange: #ff6b00;
            --standout-blue: #03b7fa;
            --neutral-dark-1: #1a1a1e;
            --neutral-dark-2: #101013;
            --neutral-light-1: #333;
            --light-text: #f0f0f0;
            --font-headings: 'Bebas Neue', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
        }
        body {
            background-color: var(--neutral-dark-2);
            color: var(--light-text);
            font-family: 'Roboto', sans-serif;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        h2 {
            font-family: var(--font-headings);
            font-size: 4rem;
            color: var(--light-text);
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        h2::after {
            content: attr(data-text);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
            color: transparent;
            -webkit-text-stroke: 1px var(--primary-purple);
            z-index: -1;
        }
        .loading-spinner {
            border: 5px solid #f3f3f3; 
            border-top: 5px solid var(--primary-purple);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Page-specific styles from your example --- */
        .page-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .region-filters {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            font-family: var(--font-headings);
            font-size: 1.2rem;
            letter-spacing: 1px;
            padding: 10px 25px;
            border: 2px solid var(--neutral-light-1);
            background: transparent;
            color: var(--light-text);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .filter-btn:hover {
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }
        .filter-btn.active {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
            color: var(--light-text);
            box-shadow: 0 0 15px rgba(156, 70, 200, 0.5);
        }

        .btn-highlight {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }
        .btn-highlight:hover {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
            color: var(--neutral-dark-1);
        }

        .region-header {
            grid-column: 1 / -1;
            font-size: 2.5rem;
            font-family: var(--font-headings);
            color: var(--accent-orange);
            border-bottom: 2px solid var(--neutral-light-1);
            padding-bottom: 10px;
            margin: 40px 0 20px 0;
        }
        .region-header:first-of-type {
            margin-top: 0;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }
        .team-card {
            background: linear-gradient(145deg, var(--neutral-dark-1), var(--neutral-dark-2));
            border-radius: 15px;
            padding: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 2px solid var(--neutral-dark-2);
            transition: all 0.3s ease;
        }
        .team-card:hover {
            transform: translateY(-5px);
            border-color: var(--standout-blue);
            box-shadow: 0 8px 25px rgba(3, 183, 250, 0.2);
        }
        .team-card-logo {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            background-color: #0a0a0a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        .team-card-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .team-card-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .team-card-info h3 {
            font-family: var(--font-tech);
            font-size: 1.5rem;
            color: var(--light-text);
            margin: 0 0 10px 0;
        }
        .player-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
            flex-grow: 1;
        }
        .player-list li {
            color: #ccc;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team-card.paid { /* This class gives the green "confirmed" border */
            border-color: #28a745;
        }
        .team-card.paid:hover {
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            margin-top: 12px;
            width: fit-content;
        }
        .status-confirmed {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>

    <header></header>

    <main>
        <section id="teams-page" style="padding-top: 120px;">
            <div class="container">
                <h2 data-text="Registered Teams">Registered Teams</h2>
                
                <div class="page-actions">
                    <div class="region-filters">
                        <button class="filter-btn active" data-region="ALL">All Regions</button>
                        <button class="filter-btn" data-region="NA">North America</button>
                        <button class="filter-btn" data-region="EU">Europe</button>
                    </div>

                    <!-- IMPORTANT: Change href attributes to your actual bracket page URLs -->
                    <a href="/NA-Bracket" class="filter-btn btn-highlight">View NA Bracket</a>
                    <a href="/EU-Bracket" class="filter-btn btn-highlight">View EU Bracket</a>
                </div>
                
                <div id="teams-list-container" class="team-grid">
                    <div class="loading-spinner-wrapper" style="grid-column: 1 / -1; display: flex; justify-content: center; padding: 50px;">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="/js/main.js" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ===================================================================
            // !!! IMPORTANT: PASTE YOUR SPREADSHEET ID HERE !!!
            // This is the long string of characters in your Google Sheet URL.
            // ===================================================================
            const SPREADSHEET_ID = '10ZmWteGljWdAu4TIMMkKkt23jFSuuKlTtqc-bxpVvN4'; // <-- REPLACE THIS
            // ===================================================================

            const EU_GID = '1547719174'; // Your EU Sheet GID
            const NA_GID = '1340906972'; // Your NA Sheet GID

            const EU_API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${EU_GID}&headers=1`;
            const NA_API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${NA_GID}&headers=1`;

            const teamsContainer = document.getElementById('teams-list-container');
            const loader = document.querySelector('.loading-spinner-wrapper');
            const filterButtonsContainer = document.querySelector('.region-filters');
            
            let allTeamsData = [];

            function sanitizeTeamName(name) {
                if (!name) return 'unnamed-team';
                return name.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/--+/g, '-');
            }

            function createTeamCardHTML(team) {
                const sanitizedName = sanitizeTeamName(team.teamName);
                const teamLogoUrl = `images/worlds/logos/${sanitizedName}.png`;
                const cardStatusClass = 'paid'; // Assumes all teams are confirmed
                const statusBadgeHTML = `<div class="status-badge status-confirmed">Confirmed</div>`;

                return `
                    <div class="team-card ${cardStatusClass}">
                        <div class="team-card-logo">
                            <img src="${teamLogoUrl}" alt="${team.teamName} Logo" onerror="this.onerror=null;this.src='images/default-logo.png';">
                        </div>
                        <div class="team-card-info">
                            <h3>${team.teamName}</h3>
                            <ul class="player-list">
                                <li><strong>Player 1:</strong> ${team.player1}</li>
                                <li><strong>Player 2:</strong> ${team.player2}</li>
                                <li><strong>Player 3:</strong> ${team.player3}</li>
                            </ul>
                            ${statusBadgeHTML}
                        </div>
                    </div>
                `;
            }
            
            function renderTeams(regionFilter) {
                let html = '';
                const teamsToDisplay = allTeamsData.filter(team => {
                    if (regionFilter === 'ALL') return true;
                    return team.region.toUpperCase() === regionFilter;
                });

                if (teamsToDisplay.length === 0 && regionFilter !== 'ALL') {
                    html = `<p class="rankings-intro" style="grid-column: 1 / -1;">No teams from ${regionFilter} have signed up yet.</p>`;
                    teamsContainer.innerHTML = html;
                    return;
                }

                if (regionFilter === 'ALL') {
                    const naTeams = allTeamsData.filter(t => t.region.toUpperCase() === 'NA');
                    const euTeams = allTeamsData.filter(t => t.region.toUpperCase() === 'EU');
                    if (naTeams.length > 0) {
                        html += `<h3 class="region-header">North America</h3>`;
                        naTeams.forEach(team => html += createTeamCardHTML(team));
                    }
                    if (euTeams.length > 0) {
                        html += `<h3 class="region-header">Europe</h3>`;
                        euTeams.forEach(team => html += createTeamCardHTML(team));
                    }
                } else {
                    teamsToDisplay.forEach(team => html += createTeamCardHTML(team));
                }
                
                teamsContainer.innerHTML = html || `<p class="rankings-intro" style="grid-column: 1 / -1;">No teams have signed up yet. Check back soon!</p>`;
            }
            
            function processSheetData(responseText, region) {
                const jsonString = responseText.match(/google\.visualization\.Query\.setResponse\((.*)\)/s)[1];
                const data = JSON.parse(jsonString);

                return data.table.rows.map(row => ({
                    teamName: row.c[0]?.v || '',    // Column A
                    player1:  row.c[1]?.v || 'N/A', // Column B
                    player2:  row.c[2]?.v || 'N/A', // Column C
                    player3:  row.c[3]?.v || 'N/A', // Column D
                    region:   region
                })).filter(team => team.teamName && team.teamName.trim() !== '');
            }

            async function initializeTeamList() {
                try {
                    const [naResponse, euResponse] = await Promise.all([
                        fetch(NA_API_URL),
                        fetch(EU_API_URL)
                    ]);

                    if (!naResponse.ok || !euResponse.ok) throw new Error(`Network response error`);

                    const [naText, euText] = await Promise.all([
                        naResponse.text(),
                        euResponse.text()
                    ]);

                    const naTeams = processSheetData(naText, 'NA');
                    const euTeams = processSheetData(euText, 'EU');

                    allTeamsData = [...naTeams, ...euTeams];
                    
                    if (loader) loader.style.display = 'none';
                    renderTeams('ALL');

                } catch (error) {
                    console.error('Failed to fetch or process team data:', error);
                    if(loader) loader.style.display = 'none';
                    teamsContainer.innerHTML = `<p class="rankings-intro" style="grid-column: 1 / -1; color: var(--accent-orange);">Could not load team data. Make sure the Spreadsheet ID is correct and both sheets are public.</p>`;
                }
            }

            filterButtonsContainer.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    filterButtonsContainer.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    const region = e.target.getAttribute('data-region');
                    renderTeams(region);
                }
            });

            initializeTeamList();
        });
    </script>
</body>
</html>
