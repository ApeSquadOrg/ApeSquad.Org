    <!-- Tool Styles -->
    <style>
      #gun-data-page { background-color: var(--near-black); padding-bottom: 4rem; }
      .data-module { background-color: var(--midnight-black); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 2.5rem 2rem; min-height: 600px; }
      .controls { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2rem; }
      .control-group { flex-grow: 1; min-width: 150px; }
      .control-group label { display: block; margin-bottom: 0.75rem; color: var(--off-white); font-family: var(--font-headline); letter-spacing: 1px; text-transform: uppercase; }
      .toggle-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .toggle-btn { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background-color: transparent; color: var(--light-grey); cursor: pointer; transition: all 0.2s ease; font-family: var(--font-body); }
      .toggle-btn:hover { background-color: rgba(1, 163, 235, 0.1); color: var(--off-white); }
      .toggle-btn.active { background-color: var(--electric-blue); color: var(--off-white); border-color: var(--electric-blue); font-weight: bold; }
      .hsp-slider-container { display: flex; align-items: center; gap: 1rem; }
      .hsp-slider-container input[type="range"] { flex-grow: 1; accent-color: var(--electric-blue); }
      
      .graph-section { display: flex; flex-direction: column; gap: 1.5rem; }
      @media (min-width: 992px) { .graph-section { flex-direction: row; align-items: flex-start; } }
      
      .graph-container { position: relative; height: 400px; width: 100%; background-color: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; flex-grow: 1; }
      .plot-area { position: absolute; top: 40px; bottom: 40px; left: 40px; right: 15px; }
      .legend, .info-panel { background: var(--near-black); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; max-height: 400px; }
      .legend { width: 100%; overflow-y: auto; }
      @media (min-width: 992px) { .legend, .info-panel { width: 250px; flex-shrink: 0; } }
      
      .legend-item { display: flex; align-items: center; margin-bottom: 4px; cursor: pointer; padding: 4px; border-radius: 4px; }
      .legend-item:hover, .legend-item.highlighted { background-color: rgba(255,255,255,0.1); }
      .legend-item.selected { background-color: rgba(1, 163, 235, 0.2); border: 1px solid rgba(1, 163, 235, 0.5); }
      .legend-color { width: 12px; height: 12px; margin-right: 8px; border-radius: 50%; }
      .legend-text { font-size: 0.85rem; color: #ddd; }
      
      /* Info Panel */
      .info-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
      .info-label { color: #888; } .info-value { color: #fff; font-weight: bold; }
      
      /* Loading State */
      #loading-state { text-align: center; padding: 4rem; color: var(--electric-blue); font-family: var(--font-headline); font-size: 1.5rem; }
      #content-area { display: none; opacity: 0; transition: opacity 0.5s ease; }
      #content-area.visible { display: block; opacity: 1; }

      /* Cards */
      #weapon-cards-container { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 2rem; }
      .weapon-card { background: var(--near-black); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.5rem; border-top: 3px solid transparent; }
      .weapon-card h3 { margin-top: 0; }
      .weapon-card li { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 5px 0; color: #ccc; font-size: 0.9rem; }
      .weapon-card strong { color: #fff; }

      /* SVG Graph */
      .weapon-line { fill: none; transition: all 0.2s; cursor: pointer; }
      .weapon-hitbox { fill: none; stroke: transparent; stroke-width: 15px; cursor: pointer; }
      .weapon-line.dimmed { opacity: 0.1; }
      .weapon-line.highlighted { stroke-width: 4px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); opacity: 1; }
      .grid-line { stroke: rgba(255,255,255,0.1); stroke-width: 1px; }
      .axis-labels { position: absolute; color: #666; font-size: 0.75rem; }

/* Add this inside your <style> block */
.cursor-line {
  stroke: rgba(255, 255, 255, 0.6);
  stroke-width: 1px;
  stroke-dasharray: 5, 5; /* Dashed line */
  pointer-events: none;    /* Let clicks pass through it */
  opacity: 0;              /* Hidden by default */
  transition: opacity 0.1s;
}
.cursor-line.visible {
  opacity: 1;
}

                        </div>
                        <div class="axis-labels" id="y-labels" style="left: 5px; top: 40px; bottom: 40px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end;"></div>
                      </div>

                      <div class="info-panel" id="info-panel">
                        <div style="color:var(--electric-blue); font-family:var(--font-headline); margin-bottom:1rem; border-bottom:1px solid #333; padding-bottom:0.5rem;">Live Stats</div>
                        <div id="info-content-details" style="color:#888; text-align:center; margin-top:2rem;">
                            Hover over a line.<br>Click to pin.
                        </div>
                      </div>

                    <div id="weapon-cards-container"></div>
                    
                    <div style="margin-top:2rem; color:#666; font-size:0.8rem; text-align:center; font-style:italic;">
                        Note: TTK calculations include reload time if shots required exceed magazine size. Burst weapons account for burst delay cycles.

              </div>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- CONFIGURATION ---
        const SHEET_ID = "12aWohgro45Mp-8bwGpL09jDmCcAwvYEAr0sm3fYDxFY";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
        
        const HEALTH_VALUES = { Light: 150, Medium: 250, Heavy: 350 };
        const MAX_RANGE = 100;
        
        // --- STATE ---
        let weaponData = [];
        let selectedWeaponNames = new Set();
        let currentlyPlotted = [];
        let elements = {}; 
        let currentMaxY = 0; 

        // --- INIT ---
        function init() {
            cacheElements();
            setupListeners();
            fetchData();
        }

        function cacheElements() {
            elements = {
                loading: document.getElementById('loading-state'),
                content: document.getElementById('content-area'),
                plotArea: document.getElementById('plot-area'),
                legend: document.getElementById('legend'),
                yLabels: document.getElementById('y-labels'),
                graphTitle: document.getElementById('graph-title'),
                infoContent: document.getElementById('info-content-details'),
                cards: document.getElementById('weapon-cards-container'),
                clearBtn: document.getElementById('clear-selection-btn'),
                
                // Inputs
                classGroup: document.getElementById('class-toggle-group'),
                targetGroup: document.getElementById('target-toggle-group'),
                hitlocGroup: document.getElementById('hitloc-toggle-group'),
                metricGroup: document.getElementById('metric-toggle-group'),
                hspSlider: document.getElementById('hsp-slider'),
                hspValue: document.getElementById('hsp-value-display'),
                hspContainer: document.getElementById('hsp-control-group'),
                mixedBtn: document.getElementById('mixed-hit-btn')
            };
        }

        function fetchData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: (results) => {
                    processData(results.data);
                    elements.loading.style.display = 'none';
                    elements.content.classList.add('visible');
                    updateGraph();
                },
                error: (err) => {
                    elements.loading.innerHTML = `<span style="color:red">Error loading data.</span><br>${err.message}`;
                }
            });
        }

        function processData(rawData) {
            weaponData = rawData
                .filter(row => row.Name && row.Class) 
                .map(row => {
                    let magSize = row['Magazine Size'];
                    if (typeof magSize === 'string') {
                         if (magSize.includes('(')) magSize = parseFloat(magSize.split('(')[0]);
                         else if (magSize === "N/A") magSize = Infinity;
                    }

                    return {
                        name: row.Name,
                        class: row.Class.toUpperCase(),
                        body: Number(row['Body Damage']) || 0,
                        head: Number(row['Head Damage']) || 0,
                        rpm: Number(row.RPM) || 0,
                        burstCount: Number(row['Burst Count']) || 1,
                        burstDelay: Number(row['Burst Delay']) || 0,
                        minDrop: Number(row['Min Dropoff']) || 0,
                        maxDrop: Number(row['Max Dropoff']) || 0,
                        dropMod: Number(row['Dropoff Modifier']) || 1,
                        mag: magSize || 0,
                        reloadEmpty: Number(row['Empty Reload']) || 0,
                        reloadTac: Number(row['Tactical Reload']) || 0,
                        notes: row.Notes,
                        color: getRandomColor()
                    };
                });
        }

        function getRandomColor() {
            const h = Math.floor(Math.random() * 360);
            return `hsl(${h}, 90%, 65%)`; 
        }

        // --- MATH LOGIC ---

        function getDamage(w, range, hitLoc, hsp) {
            let baseDmg = hitLoc === 'Head' ? w.head : w.body;
            if (hitLoc === 'Mixed') baseDmg = (w.head * hsp) + (w.body * (1 - hsp));

            if (w.maxDrop <= 0 || w.dropMod >= 1) return baseDmg;
            
            if (range <= w.minDrop) return baseDmg;
            if (range >= w.maxDrop) return baseDmg * w.dropMod;

            const ratio = (range - w.minDrop) / (w.maxDrop - w.minDrop);
            const dropAmount = ratio * (1 - w.dropMod);
            return baseDmg * (1 - dropAmount);
        }

        function calculateTTK(w, range, targetHP, hitLoc, hsp) {
            const dmgPerShot = getDamage(w, range, hitLoc, hsp);
            if (dmgPerShot <= 0 || !w.rpm) return Infinity;

            const shotsToKill = Math.ceil(targetHP / dmgPerShot);
            const timePerShot = 60 / w.rpm;
            let firingTime = 0;

            if (w.burstCount > 1 && w.burstDelay > 0) {
                const burstsNeeded = Math.ceil(shotsToKill / w.burstCount);
                const bulletsInLastBurst = shotsToKill % w.burstCount || w.burstCount;
                if (burstsNeeded > 1) {
                    const fullBurstTime = (w.burstCount - 1) * timePerShot;
                    const fullCycleTime = fullBurstTime + w.burstDelay;
                    firingTime += (burstsNeeded - 1) * fullCycleTime;
                }
                firingTime += (bulletsInLastBurst - 1) * timePerShot;
            } else {
                firingTime = (shotsToKill - 1) * timePerShot;
            }

            if (w.mag !== Infinity && shotsToKill > w.mag) {
                const reloads = Math.floor((shotsToKill - 1) / w.mag);
                const reloadTime = w.reloadEmpty || w.reloadTac || 2.5; 
                firingTime += (reloads * reloadTime);
            }
            return firingTime;
        }

        function calculateDPS(w, range, hitLoc, hsp) {
            const dmg = getDamage(w, range, hitLoc, hsp);
            if (w.burstCount > 1 && w.burstDelay > 0) {
                const dmgPerBurst = dmg * w.burstCount;
                const burstFireTime = (w.burstCount - 1) * (60 / w.rpm);
                const cycleTime = burstFireTime + w.burstDelay;
                return dmgPerBurst / cycleTime;
            }
            return dmg * (w.rpm / 60);
        }

        // --- SHARED "FIND CLOSEST WEAPON" LOGIC ---
        // Used by both Hover and Click
        function findClosestWeapon(mouseY, rangeInMeters, rectHeight) {
            const target = elements.targetGroup.querySelector('.active').dataset.target;
            const targetHP = HEALTH_VALUES[target];
            const hitLoc = elements.hitlocGroup.querySelector('.active').dataset.hitloc;
            const metric = elements.metricGroup.querySelector('.active').dataset.metric;
            const hsp = parseFloat(elements.hspSlider.value) / 100;

            // Separate selected vs unselected
            const selectedWeapons = currentlyPlotted.filter(w => selectedWeaponNames.has(w.name));
            const unselectedWeapons = currentlyPlotted.filter(w => !selectedWeaponNames.has(w.name));

            // Helper function to find best match in a list
            const scanList = (list, threshold) => {
                let found = null;
                let minDiff = Infinity;

                list.forEach(w => {
                    let val = metric === 'TTK' 
                        ? calculateTTK(w, rangeInMeters, targetHP, hitLoc, hsp)
                        : calculateDPS(w, rangeInMeters, hitLoc, hsp);
                    
                    if (!isFinite(val)) val = (metric === 'TTK') ? currentMaxY * 1.5 : 0;

                    // Convert Value to Pixel Y (Inverted because SVG 0 is top)
                    const pixelY = rectHeight - ((Math.min(val, currentMaxY) / currentMaxY) * rectHeight);
                    
                    const diff = Math.abs(mouseY - pixelY);
                    if (diff < minDiff && diff < threshold) {
                        minDiff = diff;
                        found = w;
                    }
                });
                return found;
            };

            // 1. Priority: Check pinned weapons with huge hitbox (150px)
            let result = scanList(selectedWeapons, 150);
            
            // 2. Fallback: Check unselected weapons with small hitbox (30px)
            if (!result) {
                result = scanList(unselectedWeapons, 30);
            }

            return result;
        }

        // --- EVENT HANDLERS ---

        function handlePlotInteraction(e) {
            const rect = elements.plotArea.getBoundingClientRect();
            
            // Normalize Mouse X/Y
            let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Bounds check
            if (x < 0 || x > rect.width || y < 0 || y > rect.height) {
                hideCursor();
                clearHighlights();
                return;
            }

            // Calculations
            const range = (x / rect.width) * MAX_RANGE;
            
            // Update Vertical Cursor Line
            updateCursorLine(x);

            // Find closest weapon
            const weapon = findClosestWeapon(y, range, rect.height);

            // ACTION: If Clicked
            if (e.type === 'click') {
                if (weapon) toggleSelect(weapon.name);
                return; // Stop processing hover if clicked
            }

            // ACTION: If Hovering
            if (weapon) {
                highlight(weapon.name, true);
                
                // Pop line to front for visibility
                const line = document.getElementById(`line-${weapon.name.replace(/\s/g, '-')}`);
                if (line) line.parentElement.appendChild(line);

                // Update Info Panel
                updateInfoPanelDynamic(weapon, range);
            } else {
                clearHighlights();
                resetInfoPanel();
            }
        }

        function updateCursorLine(x) {
            const line = document.getElementById('cursor-line');
            if (line) {
                line.setAttribute('x1', x);
                line.setAttribute('x2', x);
                line.classList.add('visible');
            }
        }

        function hideCursor() {
            const line = document.getElementById('cursor-line');
            if (line) line.classList.remove('visible');
        }

        function clearHighlights() {
            document.querySelectorAll('.weapon-line.highlighted').forEach(el => el.classList.remove('highlighted'));
            document.querySelectorAll('.legend-item.highlighted').forEach(el => el.classList.remove('highlighted'));
        }

        function resetInfoPanel() {
            elements.infoContent.innerHTML = `<div style="color:#888; text-align:center; margin-top:2rem;">Hover over a line.<br>Click graph to pin.</div>`;
        }

        function updateInfoPanelDynamic(w, range) {
            const target = elements.targetGroup.querySelector('.active').dataset.target;
            const targetHP = HEALTH_VALUES[target];
            const hitLoc = elements.hitlocGroup.querySelector('.active').dataset.hitloc;
            const metric = elements.metricGroup.querySelector('.active').dataset.metric;
            const hsp = parseFloat(elements.hspSlider.value) / 100;

            const val = metric === 'TTK' 
                ? calculateTTK(w, range, targetHP, hitLoc, hsp).toFixed(3) + 's'
                : calculateDPS(w, range, hitLoc, hsp).toFixed(0);

            const dmg = getDamage(w, range, hitLoc, hsp).toFixed(1);
            const stk = Math.ceil(targetHP / getDamage(w, range, hitLoc, hsp));
            const rangeDisplay = range.toFixed(1);

            elements.infoContent.innerHTML = `
                <div class="info-row"><span class="info-label">Weapon</span> <span class="info-value" style="color:${w.color}; font-size:1.1rem;">${w.name}</span></div>
                <div class="info-row"><span class="info-label">Range</span> <span class="info-value">${rangeDisplay}m</span></div>
                <div class="info-row"><span class="info-label">${metric}</span> <span class="info-value" style="color:var(--electric-blue);">${val}</span></div>
                <div class="info-row"><span class="info-label">Damage</span> <span class="info-value">${dmg}</span></div>
                ${metric === 'TTK' ? `<div class="info-row"><span class="info-label">Shots to Kill</span> <span class="info-value">${stk}</span></div>` : ''}
                <div class="info-row"><span class="info-label">Dropoff</span> <span class="info-value">${w.minDrop}m - ${w.maxDrop}m</span></div>
            `;
        }

        // --- RENDERING ---

        function updateGraph() {
            const activeClasses = Array.from(elements.classGroup.querySelectorAll('.active')).map(b => b.dataset.class);
            const target = elements.targetGroup.querySelector('.active').dataset.target;
            const targetHP = HEALTH_VALUES[target];
            const hitLoc = elements.hitlocGroup.querySelector('.active').dataset.hitloc;
            const metric = elements.metricGroup.querySelector('.active').dataset.metric;
            const hsp = parseFloat(elements.hspSlider.value) / 100;

            elements.mixedBtn.innerText = `Mixed (${(hsp*100).toFixed(0)}%)`;
            elements.hspContainer.style.display = hitLoc === 'Mixed' ? '' : 'none';
            elements.targetGroup.parentElement.style.display = metric === 'TTK' ? '' : 'none';
            elements.clearBtn.style.display = selectedWeaponNames.size > 0 ? 'inline-block' : 'none';

            currentlyPlotted = weaponData.filter(w => activeClasses.includes('ALL') || activeClasses.includes(w.class));
            currentlyPlotted.sort((a,b) => a.name.localeCompare(b.name));

            elements.graphTitle.innerText = `${metric} vs Range (${hitLoc} Hits)`;
            if (metric === 'TTK') elements.graphTitle.innerText += ` on ${target} (${targetHP} HP)`;

            // CALC MAX Y
            let maxY = 0;
            currentlyPlotted.forEach(w => {
                [0, w.maxDrop, 100].forEach(r => {
                    const val = metric === 'TTK' 
                        ? calculateTTK(w, r, targetHP, hitLoc, hsp) 
                        : calculateDPS(w, r, hitLoc, hsp);
                    if (isFinite(val) && val > maxY) maxY = val;
                });
            });
            
            if (metric === 'TTK') maxY = Math.min(5, Math.ceil(maxY * 1.2 * 2) / 2); 
            else maxY = Math.ceil(maxY * 1.1 / 100) * 100;
            
            currentMaxY = maxY; 

            // Y Axis
            elements.yLabels.innerHTML = '';
            for(let i=0; i<=5; i++) {
                const val = maxY - (maxY * (i/5));
                const span = document.createElement('span');
                span.innerText = metric === 'TTK' ? val.toFixed(1) + 's' : Math.round(val);
                elements.yLabels.appendChild(span);
            }

            // SVG Setup
            const width = elements.plotArea.clientWidth;
            const height = elements.plotArea.clientHeight;
            elements.plotArea.innerHTML = '';
            
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            svg.style.overflow = 'visible';

            // Grid Lines
            for(let i=0; i<=5; i++) {
                const y = (i/5)*height;
                const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                hLine.setAttribute('x1', 0); hLine.setAttribute('x2', width);
                hLine.setAttribute('y1', y); hLine.setAttribute('y2', y);
                hLine.setAttribute('class', 'grid-line');
                svg.appendChild(hLine);
                const x = (i/5)*width;
                const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                vLine.setAttribute('x1', x); vLine.setAttribute('x2', x);
                vLine.setAttribute('y1', 0); vLine.setAttribute('y2', height);
                vLine.setAttribute('class', 'grid-line');
                svg.appendChild(vLine);
            }

            // NEW: Cursor Line Element
            const cursorLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            cursorLine.setAttribute('y1', 0);
            cursorLine.setAttribute('y2', height);
            cursorLine.setAttribute('class', 'cursor-line');
            cursorLine.id = 'cursor-line';
            svg.appendChild(cursorLine);

            // Legend & Lines
            elements.legend.innerHTML = '';
            const anySelected = selectedWeaponNames.size > 0;

            currentlyPlotted.forEach(w => {
                const isSel = selectedWeaponNames.has(w.name);
                
                // Legend
                const legItem = document.createElement('div');
                legItem.className = 'legend-item';
                legItem.dataset.weaponId = w.name;
                if (isSel) legItem.classList.add('selected');
                else if (anySelected) legItem.style.opacity = '0.3';
                
                legItem.innerHTML = `<div class="legend-color" style="background:${w.color}"></div><span class="legend-text">${w.name}</span>`;
                legItem.onclick = () => toggleSelect(w.name);
                elements.legend.appendChild(legItem);

                // Line Points
                const points = [];
                const ranges = [0, w.minDrop, w.maxDrop, 100].filter(r => r <= 100);
                const steps = [...new Set(ranges)].sort((a,b)=>a-b);
                
                steps.forEach(r => {
                    let val = metric === 'TTK' 
                        ? calculateTTK(w, r, targetHP, hitLoc, hsp) 
                        : calculateDPS(w, r, hitLoc, hsp);
                    if (!isFinite(val)) val = metric === 'TTK' ? maxY*1.5 : 0; 
                    const x = (r/100) * width;
                    const y = height - ((Math.min(val, maxY) / maxY) * height);
                    points.push(`${x},${y}`);
                });

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                line.setAttribute('points', points.join(' '));
                line.setAttribute('stroke', w.color);
                line.setAttribute('stroke-width', '2');
                line.setAttribute('class', 'weapon-line');
                line.id = `line-${w.name.replace(/\s/g, '-')}`;
                
                if (isSel) line.classList.add('selected');
                else if (anySelected) line.classList.add('dimmed');

                svg.appendChild(line);
            });

            // Re-order SVG to put selected items on top
            currentlyPlotted.forEach(w => {
                if(selectedWeaponNames.has(w.name)) {
                    const line = svg.querySelector(`#line-${w.name.replace(/\s/g, '-')}`);
                    if(line) svg.appendChild(line);
                }
            });

            elements.plotArea.appendChild(svg);
            renderCards();
        }

        function highlight(name, active) {
            clearHighlights();
            if (!active) return;

            const id = `line-${name.replace(/\s/g, '-')}`;
            const line = document.getElementById(id);
            const legItem = document.querySelector(`.legend-item[data-weapon-id="${name}"]`);
            
            if (line) line.classList.add('highlighted');
            if (legItem) legItem.classList.add('highlighted');
        }

        function toggleSelect(name) {
            if (selectedWeaponNames.has(name)) selectedWeaponNames.delete(name);
            else selectedWeaponNames.add(name);
            updateGraph();
        }

        function renderCards() {
            elements.cards.innerHTML = '';
            selectedWeaponNames.forEach(name => {
                const w = weaponData.find(x => x.name === name);
                if (!w) return;
                
                const card = document.createElement('div');
                card.className = 'weapon-card';
                card.style.borderTopColor = w.color;
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <h3 style="color:${w.color}; margin:0;">${w.name}</h3>
                        <button onclick="document.dispatchEvent(new CustomEvent('unpin', {detail:'${w.name}'}))" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem;">&times;</button>
                    </div>
                    <ul>
                        <li><span>Class</span> <strong>${w.class}</strong></li>
                        <li><span>Dmg (Body/Head)</span> <strong>${w.body} / ${w.head}</strong></li>
                        <li><span>RPM</span> <strong>${w.rpm}</strong></li>
                        <li><span>Mag Size</span> <strong>${w.mag === Infinity ? '∞' : w.mag}</strong></li>
                        <li><span>Reload (Empty)</span> <strong>${w.reloadEmpty}s</strong></li>
                    </ul>
                    ${w.notes ? `<div style="margin-top:10px; font-size:0.8rem; color:#888; border-top:1px solid #333; padding-top:5px;">${w.notes}</div>` : ''}
                `;
                elements.cards.appendChild(card);
            });
        }

        // --- LISTENERS ---
        function setupListeners() {
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.toggle-btn');
                if (!btn) return;
                const group = btn.parentElement;
                
                if (group.id === 'class-toggle-group') {
                    if (btn.dataset.class === 'ALL') {
                        group.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
                        btn.classList.add('active');
                    } else {
                        btn.classList.toggle('active');
                        group.querySelector('[data-class="ALL"]').classList.remove('active');
                        if (!group.querySelector('.active')) group.querySelector('[data-class="ALL"]').classList.add('active');
                    }
                } else if (group.classList.contains('toggle-group')) {
                    group.querySelectorAll('.active').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
                
                if (btn.id === 'randomize-colors-btn') {
                    weaponData.forEach(w => w.color = getRandomColor());
                } else if (btn.id === 'clear-selection-btn') {
                    selectedWeaponNames.clear();
                }
                updateGraph();
            });

            elements.hspSlider.addEventListener('input', () => {
                elements.hspValue.innerText = elements.hspSlider.value + '%';
                updateGraph();
            });

            // GLOBAL HOVER & CLICK HANDLER
            elements.plotArea.addEventListener('mousemove', handlePlotInteraction);
            elements.plotArea.addEventListener('touchmove', handlePlotInteraction, {passive: true});
            
            // SMART CLICK
            elements.plotArea.addEventListener('click', handlePlotInteraction);
            
            elements.plotArea.addEventListener('mouseleave', () => {
                hideCursor();
                clearHighlights();
                resetInfoPanel();
            });

            // Card Close
            document.addEventListener('unpin', (e) => toggleSelect(e.detail));
            
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(updateGraph, 100);
            });
        }

        init();
    });
    </script>
    
    <script src="js/main.js"></script>
    <script src="js/features.js"></script>
</body>
</html>
