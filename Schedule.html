<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8868N4WQZJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-8868N4WQZJ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive competition calendar for The Finals. Navigate through the months and find all tournament dates for Ape Squad Esports.">
    <title>Interactive Calendar | Ape Squad</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="/style.css">

</head>
<body>

    <!-- This header is left empty. Your js/main.js file will populate it. -->
    <header></header>

    <main>
        <section id="interactive-calendar-page">
            <div class="container">

                <h2 class="glitch" data-text="COMPETITION CALENDAR">COMPETITION CALENDAR</h2>
                <p class="calendar-intro">
                    Navigate the schedule with our interactive calendar. Click on any event to get more details.
                </p>

                <div class="calendar-wrapper">
                    <div class="calendar-header">
                        <button id="prev-month" class="nav-btn">&lt;</button>
                        <h3 id="month-year-display"></h3>
                        <button id="next-month" class="nav-btn">&gt;</button>
                    </div>
                    <div class="weekdays">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div id="calendar-days" class="calendar-days">
                        <!-- Days will be generated by JavaScript -->
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- This footer is left empty. Your js/main.js file will populate it. -->
    <footer></footer>
    
    <!-- This script handles global functionality like loading the header/footer -->
    <script src="/js/main.js"></script>

    <!-- The new script to power the interactive calendar -->
    <script src="/js/calendar.js"></script>

</body>
</html>
