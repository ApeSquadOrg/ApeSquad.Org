<div class="container">
    <div class="logo">
        <a href="https://apesquad.org">
            <img src="/images/logo.png" alt="Ape Squad Logo" class="logo-image">
        </a>
    </div>

    <div class="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>

    <div class="nav-links">
        <ul>
            <li><a href="https://apesquad.org">Home</a></li>
            <li><a href="/merch">Merch</a></li>
            <li><a href="/donate">Donate</a></li>
            <li><a href="/club">Club</a></li>
            <li><a href="/tournaments">Tournaments</a></li>
            <li><a href="/rankings">Rankings</a></li>

            <li class="dropdown">
                <a class="dropbtn">WIKI</a>
                <div class="dropdown-content">
                    <a href="/gundata">Gun Data</a>
                    <a href="/maps">Maps</a>
                </div>
            </li>
        </ul>
    </div>
</div>

<style>
    /* This CSS is specifically for the mobile menu.
       Your existing desktop styles in your external CSS file will still apply. 
    */
    .logo-image {
        height: 50px;
    }

    /* Hide hamburger menu by default */
    .hamburger {
        display: none;
        cursor: pointer;
    }

    .hamburger .bar {
        display: block;
        width: 25px;
        height: 3px;
        margin: 5px auto;
        background-color: #fff;
        transition: all 0.3s ease-in-out;
    }
    
    /* Make sure the dropdown is hidden by default on mobile */
    .dropdown-content {
        display: none;
    }

    /* Media query for mobile devices */
    @media (max-width: 768px) {
        .container {
            flex-wrap: wrap; /* Allows items to wrap on smaller screens */
            justify-content: space-between;
        }

        .nav-links {
            display: none; /* This is what the JS toggles */
            width: 100%;
            position: absolute;
            top: 70px; /* Adjust based on your header height */
            left: 0;
            background-color: #2c2c2c;
            text-align: center;
            flex-direction: column;
        }

        .nav-links.active {
            display: block; /* The class that gets added by JS */
        }
        
        .nav-links ul {
            flex-direction: column;
            width: 100%;
        }

        .nav-links li {
            margin: 0;
            padding: 1rem 0;
            border-bottom: 1px solid #444;
        }
        
        .nav-links li:last-child {
            border-bottom: none;
        }

        .nav-links a {
            display: block;
            padding: 1rem;
        }

        .hamburger {
            display: block;
        }

        /* Adjust dropdown for mobile */
        .dropdown-content.active-mobile {
            display: block;
            position: static; /* Overrides the absolute position for mobile */
            box-shadow: none;
        }
        
        /* Disable hover on mobile */
        .dropdown:hover .dropdown-content {
            display: none;
        }
    }
</style>

<script>
    // This script ensures the mobile menu and dropdowns work correctly
    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        const dropbtn = document.querySelector('.dropbtn');
        const dropdownContent = document.querySelector('.dropdown-content');

        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
        
        if (dropbtn && dropdownContent) {
            dropbtn.addEventListener('click', (e) => {
                // Prevent the link from navigating on mobile
                e.preventDefault(); 
                // Toggle the mobile dropdown content
                dropdownContent.classList.toggle('active-mobile');
            });
        }
    });
</script>
