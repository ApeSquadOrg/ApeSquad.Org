<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Finals Esports Timeline Showcase</title>

    <!-- Google Font for the Timeline -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- This header is left empty. Your js/main.js file will populate it. -->
    <header></header>

    <!-- Main Timeline Content -->
    <div class="timeline-container">
        <div class="background-aurora"></div>
        
        <div class="scroll-indicator">
            <div>Scroll to explore</div>
        </div>
        
        <div class="container">
            <div class="header">
                <h1 class="main-title">Loading Timeline...</h1>
                <p class="subtitle">Fetching the latest data from the arena!</p>
            </div>
        </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!--
      CORRECTION:
      The entire large <script> block that was here has been removed.
      It has been replaced with a single script tag that correctly loads
      your main JavaScript file, just like your 404.html page.
    -->
    <script src="/js/main.js"></script>

    <!-- The timeline-specific JavaScript can remain here as it's unique to this page -->
   <script>
document.addEventListener('DOMContentLoaded', () => {
    const SPREADSHEET_ID = '1ANpjO4mcIdjZGZ939-Os2fYq0lDkUvTPn1Ibj4KpBbA';
    const GID = '0';
    const API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;
    const CACHE_KEY = 'timelineDataCache';
    const CACHE_DURATION_MINUTES = 60; // Cache data for 1 hour

    let allEvents = []; // Store all events in a global-like scope for the observer to access

    // --- Helper functions for generating HTML snippets ---
    const getThemeAndTag = (category) => {
        // ... (this function is unchanged)
        const catLower = (category || '').toLowerCase().replace(/\s+/g, '-');
        const validThemes = ['community', 'premier', 'grassroots', 'special-event', 'milestone', 'embark'];
        if (validThemes.includes(catLower)) {
            return { theme: `theme-${catLower}`, tag: `tag-${catLower}` };
        }
        return { theme: 'theme-default', tag: 'tag-default' };
    };

    const generateLinkHTML = (link) => {
        // ... (this function is unchanged)
        if (!link || link.trim().toLowerCase() === 'n/a') { return ''; }
        const isVideo = link.includes('youtube.com') || link.includes('twitch.tv');
        const linkText = isVideo ? '📺 Watch VOD' : 'ℹ️ More Info';
        return `<div class="event-links"><div class="event-link"><a href="${link}" target="_blank">${linkText}</a></div></div>`;
    };

    // NEW: Generates the HTML for a single, fully-rendered card
    const generateCardContentHTML = (event) => {
        const { theme, tag } = getThemeAndTag(event.category);
        return `
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <span class="event-tag ${tag}">${event.category}</span>
                <h3 class="event-title">${event.eventName}</h3>
                <p class="event-subtitle">${event.type}</p>
                <p class="event-date">${event.date}</p>
                ${event.description ? `<p class="event-description">${event.description}</p>` : ''}
                ${generateLinkHTML(event.link)}
            </div>
        `;
    };
    
    // MODIFIED: Generates placeholders instead of full cards
    const generateTimelinePlaceholdersHTML = (events) => {
        let currentSeason = null;
        let itemCounter = 0;
        const seasonDividerColors = ['green', 'cyan', 'blue', 'purple', 'orange', 'red'];
        let colorIndex = 0;
        let html = '';

        events.forEach((event, index) => {
            if (event.season !== currentSeason) {
                if (currentSeason !== null) { html += `</div>`; }
                currentSeason = event.season;
                const dividerColorClass = `divider-theme-${seasonDividerColors[colorIndex % seasonDividerColors.length]}`;
                colorIndex++;
                html += `<div class="season-section" id="season-${currentSeason.toLowerCase().replace(/[^a-z0-9]/g, '-')}">
                            <div class="timeline-divider ${dividerColorClass}">
                                <span><strong>${currentSeason}</strong></span>
                            </div>`;
            }

            const positionClass = itemCounter % 2 === 0 ? 'item-left' : 'item-right';
            const { theme } = getThemeAndTag(event.category);
            // This is the key change: create a simple placeholder with a data-attribute
            html += `<div class="timeline-item-placeholder ${theme} ${positionClass}" data-event-index="${index}" style="min-height: 150px;"></div>`;
            itemCounter++;
        });

        if (events.length > 0) { html += `</div>`; }
        return html;
    };

    // --- Main application logic ---

    const renderTimeline = (events) => {
        allEvents = events; // Store for later use
        const timelineHTML = generateTimelinePlaceholdersHTML(events);
        const timelineContainer = document.querySelector('.timeline-container .container');
        
        timelineContainer.innerHTML = `
            <div class="header">
                <br><br><br>
                <h1 class="main-title">History of The Finals Esports</h1>
                <p class="subtitle">From Beta Tournaments to Global Competition</p>
            </div>
            <div class="timeline">${timelineHTML}</div>
        `;

        initializeScrollEffects();
    };
    
    const fetchAndRenderTimeline = async () => {
        // OPTIMIZATION 2: Caching Logic
        const cachedData = localStorage.getItem(CACHE_KEY);
        if (cachedData) {
            try {
                const { timestamp, events } = JSON.parse(cachedData);
                const isCacheValid = (new Date().getTime() - timestamp) / (1000 * 60) < CACHE_DURATION_MINUTES;
                if (isCacheValid) {
                    console.log("Rendering from valid cache.");
                    renderTimeline(events);
                    // Optionally, you could still fetch in the background to pre-warm the next cache
                    // but for this example, we'll just use the cache.
                    return; 
                }
            } catch (e) {
                console.error("Failed to parse cache", e);
                localStorage.removeItem(CACHE_KEY);
            }
        }

        try {
            const response = await fetch(API_URL);
            if (!response.ok) { throw new Error('Network response was not ok'); }
            const text = await response.text();
            
            const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/s)[1];
            const data = JSON.parse(jsonString);

            const events = data.table.rows.map(row => {
                const cells = row.c;
                return { 
                    season: cells[0]?.v || '', eventName: cells[1]?.v || 'Untitled Event', type: cells[2]?.v || '', 
                    category: cells[3]?.v || 'Community', date: cells[4]?.f || cells[4]?.v || 'TBD', 
                    description: cells[5]?.v || '', link: cells[6]?.v || null 
                };
            }).filter(event => event.season && event.eventName);
            
            // Cache the new data with a timestamp
            const cachePayload = { timestamp: new Date().getTime(), events };
            localStorage.setItem(CACHE_KEY, JSON.stringify(cachePayload));

            renderTimeline(events);

        } catch (error) {
            console.error('Failed to fetch or render timeline data:', error);
            // Error handling UI...
        }
    };

    const initializeScrollEffects = () => {
        const timelineElement = document.querySelector('.timeline-container .timeline');
        const scrollIndicator = document.querySelector('.timeline-container .scroll-indicator');
        
        // OPTIMIZATION 1: Lazy Rendering Observer
        const placeholders = document.querySelectorAll('.timeline-item-placeholder');
        
        if (!timelineElement || placeholders.length === 0) return;

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const placeholder = entry.target;
                    const eventIndex = parseInt(placeholder.dataset.eventIndex, 10);
                    const eventData = allEvents[eventIndex];
                    
                    if (eventData) {
                        // Create the real card element
                        const card = document.createElement('div');
                        card.className = placeholder.className.replace('timeline-item-placeholder', 'timeline-item');
                        card.innerHTML = generateCardContentHTML(eventData);

                        // Replace placeholder with the real card
                        placeholder.parentNode.replaceChild(card, placeholder);
                        
                        // Add visible class after a short delay for animation
                        setTimeout(() => card.classList.add('visible'), 50);
                    }

                    // Stop observing this element
                    observer.unobserve(placeholder);
                }
            });
        }, { 
            rootMargin: '0px 0px 200px 0px' // Start loading content 200px before it enters the viewport
        });
        
        placeholders.forEach(item => observer.observe(item));

        // Progress bar animation (unchanged, still good practice)
        let ticking = false;
        const updateProgressBar = () => { /* ... same as before ... */ };
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(updateProgressBar);
                ticking = true;
            }
        });
        updateProgressBar();
        
        // Scroll indicator logic (unchanged)
        let hasScrolled = false;
        const handleScrollIndicator = () => {
            if (!hasScrolled && window.scrollY > 50) {
                hasScrolled = true;
                if (scrollIndicator) scrollIndicator.classList.add('hidden');
                window.removeEventListener('scroll', handleScrollIndicator); // Clean up listener
            }
        };
        window.addEventListener('scroll', handleScrollIndicator);
    };

    fetchAndRenderTimeline();
});
</script>
    <!-- This footer is left empty. Your js/main.js file will populate it. -->
    <footer></footer>
    
    <!-- This script handles global functionality like loading the header/footer -->
    <script src="/js/main.js"></script>
</body>
</html>
