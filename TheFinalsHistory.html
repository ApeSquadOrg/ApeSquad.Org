<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Finals Esports Timeline Showcase</title>

    <!-- Google Font for the Timeline -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Link to your main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- This header is left empty. Your js/main.js file will populate it. -->
    <header></header>

    <!-- Main Timeline Content -->
    <div class="timeline-container">
        <div class="background-aurora"></div>
        
        <div class="scroll-indicator">
            <div>Scroll to explore</div>
        </div>
        
        <div class="container">
            <div class="header">
                <h1 class="main-title">Loading Timeline...</h1>
                <p class="subtitle">Fetching the latest data from the arena!</p>
            </div>
        </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>
    <footer></footer>

    <!-- This script handles global functionality like loading the header/footer -->
    <!-- 'defer' ensures it doesn't block HTML parsing -->
    <script src="/js/main.js" defer></script>

    <!-- Optimized timeline-specific JavaScript -->
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const SPREADSHEET_ID = '1ANpjO4mcIdjZGZ939-Os2fYq0lDkUvTPn1Ibj4KpBbA';
    const GID = '0'; 
    const API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;
    
    // --- Helper functions for generating HTML ---
    const getThemeAndTag = (category) => {
        const catLower = (category || '').toLowerCase().replace(/\s+/g, '-');
        const validThemes = ['community', 'premier', 'grassroots', 'special-event', 'milestone', 'embark'];
        if (validThemes.includes(catLower)) {
            return { theme: `theme-${catLower}`, tag: `tag-${catLower}` };
        }
        return { theme: 'theme-default', tag: 'tag-default' };
    };
    
    const generateLinkHTML = (link) => {
        if (!link || link.trim().toLowerCase() === 'n/a') { return ''; }
        const isVideo = link.includes('youtube.com') || link.includes('twitch.tv');
        const linkText = isVideo ? '📺 Watch VOD' : 'ℹ️ More Info';
        return `<div class="event-links"><div class="event-link"><a href="${link}" target="_blank" rel="noopener noreferrer">${linkText}</a></div></div>`;
    };

    const generateTimelineHTML = (events) => {
        let currentSeason = null;
        let itemCounter = 0;
        const seasonDividerColors = ['green', 'cyan', 'blue', 'purple', 'orange', 'red'];
        let colorIndex = 0;
        let html = '';

        events.forEach(event => {
            if (event.season !== currentSeason) {
                if (currentSeason !== null) { html += `</div>`; }
                currentSeason = event.season;
                const dividerColorClass = `divider-theme-${seasonDividerColors[colorIndex % seasonDividerColors.length]}`;
                colorIndex++;
                html += `<div class="season-section" id="season-${currentSeason.toLowerCase().replace(/[^a-z0-9]/g, '-')}"><div class="timeline-divider ${dividerColorClass}"><span><strong>${currentSeason}</strong></span></div>`;
            }

            const positionClass = itemCounter % 2 === 0 ? 'item-left' : 'item-right';
            const { theme, tag } = getThemeAndTag(event.category);
            html += `<div class="timeline-item ${theme} ${positionClass}"><div class="timeline-dot"></div><div class="timeline-content"><span class="event-tag ${tag}">${event.category}</span><h3 class="event-title">${event.eventName}</h3><p class="event-subtitle">${event.type}</p><p class="event-date">${event.date}</p>${event.description ? `<p class="event-description">${event.description}</p>` : ''}${generateLinkHTML(event.link)}</div></div>`;
            itemCounter++;
        });

        if (events.length > 0) { html += `</div>`; }
        return html;
    };

    // --- New helper function to separate rendering from fetching ---
    const renderTimeline = (events) => {
        const timelineHTML = generateTimelineHTML(events);
        const timelineContainer = document.querySelector('.timeline-container .container');
        timelineContainer.innerHTML = `
            <div class="header">
                <br><br><br>
                <h1 class="main-title">History of The Finals Esports</h1>
                <p class="subtitle">From Beta Tournaments to Global Competition</p>
            </div>
            <div class="timeline">${timelineHTML}</div>
        `;
        initializeScrollEffects();
    };

    // --- Main application logic with caching ---
    const fetchAndRenderTimeline = async () => {
        const cacheKey = 'timelineDataCache';
        const cacheDuration = 15 * 60 * 1000; // 15 minutes

        // Try to load from cache
        const cachedItem = localStorage.getItem(cacheKey);
        if (cachedItem) {
            const { timestamp, events } = JSON.parse(cachedItem);
            if (Date.now() - timestamp < cacheDuration) {
                console.log('Loading timeline from cache.');
                renderTimeline(events);
                return;
            }
        }

        // Fetch from network if cache is old or missing
        try {
            const response = await fetch(API_URL);
            if (!response.ok) { throw new Error('Network response was not ok'); }
            let text = await response.text();
            
            const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/s)[1];
            const data = JSON.parse(jsonString);

            const events = data.table.rows.map(row => {
                return { 
                    season: row.c[0]?.v || '', 
                    eventName: row.c[1]?.v || 'Untitled Event', 
                    type: row.c[2]?.v || '', 
                    category: row.c[3]?.v || 'Community', 
                    date: row.c[4]?.f || row.c[4]?.v || 'TBD', 
                    description: row.c[5]?.v || '', 
                    link: row.c[6]?.v || null 
                };
            }).filter(event => event.season && event.eventName);

            // Save new data to cache
            localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), events }));
            renderTimeline(events);

        } catch (error) {
            console.error('Failed to fetch or render timeline data:', error);
            document.querySelector('.timeline-container .container').innerHTML = `
                <div class="header"><h1 class="main-title">Error Loading Timeline</h1><p class="subtitle">Could not connect to the data source. Please try again later.</p></div>`;
        }
    };

    // --- OPTIMIZED scroll effects function ---
    const initializeScrollEffects = () => {
        const timelineElement = document.querySelector('.timeline-container .timeline');
        const timelineItems = document.querySelectorAll('.timeline-container .timeline-item');
        const scrollIndicator = document.querySelector('.timeline-container .scroll-indicator');
        
        if (!timelineElement || timelineItems.length === 0) return;

        // IntersectionObserver for revealing items (this was already good)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { rootMargin: '0px 0px -15% 0px' });
        timelineItems.forEach(item => observer.observe(item));

        // HIGH-PERFORMANCE progress bar animation
        let ticking = false;
        const updateProgressBar = () => {
            const timelineRect = timelineElement.getBoundingClientRect();
            const progress = Math.max(0, Math.min(1, -timelineRect.top / (timelineRect.height - window.innerHeight)));
            
            // This is super fast: just update a CSS variable
            timelineElement.style.setProperty('--timeline-progress', progress);
            ticking = false;
        };

        const onScroll = () => {
            if (!ticking) {
                window.requestAnimationFrame(updateProgressBar);
                ticking = true;
            }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        updateProgressBar(); // Initial call
        
        // Logic for hiding the scroll indicator
        const hideIndicator = () => {
            if (window.scrollY > 50) {
                if (scrollIndicator) scrollIndicator.classList.add('hidden');
                window.removeEventListener('scroll', hideIndicator); // Remove listener once done
            }
        };
        window.addEventListener('scroll', hideIndicator, { passive: true });
    };

    fetchAndRenderTimeline();
});
    </script>
</body>
</html>
